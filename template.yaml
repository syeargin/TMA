AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Team Hub (TMA) application stack. Phase 0: data table, private site bucket and CloudFront.
  Later phases add Cognito, the HTTP API, WebSocket API and stream fan-out to this template.

Parameters:
  Env:
    Type: String
    AllowedValues: [dev, prod]
    Description: Deployment environment.
  AppPrefix:
    Type: String
    Default: tma
    Description: Must match the bootstrap stack's AppPrefix.
  AlertEmail:
    Type: String
    Default: ""
    Description: Optional. Email for the monthly budget alert. Leave empty to skip the budget.
  MonthlyBudgetUsd:
    Type: Number
    Default: 20
    MinValue: 1
  ClubId:
    Type: String
    Default: a5
    Description: Club id used in keys (CLUB#<id>).
  ClubAdminEmails:
    Type: String
    Default: ""
    Description: Comma-separated emails that may sign up without an invite and become club admins.
  SesFromEmail:
    Type: String
    Default: ""
    Description: >
      Optional. A verified SES identity to send sign-in emails from. Empty uses Cognito's
      built-in sender (fine for testing, limited to a small number of emails per day).

Conditions:
  IsProd: !Equals [!Ref Env, prod]
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]
  UseSes: !Not [!Equals [!Ref SesFromEmail, ""]]

Globals:
  Function:
    Runtime: nodejs24.x
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 10
    Tracing: Active
    Environment:
      Variables:
        TABLE_NAME: !Ref TeamHubTable
        ENV: !Ref Env

Resources:
  # ---------- Data ----------
  TeamHubTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "TeamHub-${Env}"
      BillingMode: PAY_PER_REQUEST
      TableClass: STANDARD
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
        - { AttributeName: GSI1PK, AttributeType: S }
        - { AttributeName: GSI1SK, AttributeType: S }
        - { AttributeName: GSI2PK, AttributeType: S }
        - { AttributeName: GSI2SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - { AttributeName: GSI1PK, KeyType: HASH }
            - { AttributeName: GSI1SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
        - IndexName: GSI2
          KeySchema:
            - { AttributeName: GSI2PK, KeyType: HASH }
            - { AttributeName: GSI2SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      StreamSpecification: { StreamViewType: NEW_AND_OLD_IMAGES }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      TimeToLiveSpecification: { AttributeName: ttl, Enabled: true }
      SSESpecification: { SSEEnabled: true, SSEType: KMS }
      DeletionProtectionEnabled: !If [IsProd, true, false]
      Tags:
        - { Key: app, Value: team-hub }
        - { Key: env, Value: !Ref Env }

  # ---------- Static site ----------
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${AppPrefix}-${Env}-site-${AWS::AccountId}"
      OwnershipControls: { Rules: [{ ObjectOwnership: BucketOwnerEnforced }] }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      VersioningConfiguration: { Status: Enabled }
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-versions
            Status: Enabled
            NoncurrentVersionExpiration: { NoncurrentDays: 30 }
      Tags:
        - { Key: app, Value: team-hub }
        - { Key: env, Value: !Ref Env }

  SiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AppPrefix}-${Env}-site-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub "Team Hub ${Env}"
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        DefaultRootObject: index.html
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOriginAccessControl.Id
            S3OriginConfig: { OriginAccessIdentity: "" }
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          # Managed policies: CachingOptimized, SecurityHeadersPolicy
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
        CustomErrorResponses:
          # Single-page app: unknown paths serve index.html
          - { ErrorCode: 403, ResponseCode: 200, ResponsePagePath: /index.html, ErrorCachingMinTTL: 0 }
          - { ErrorCode: 404, ResponseCode: 200, ResponsePagePath: /index.html, ErrorCachingMinTTL: 0 }
      Tags:
        - { Key: app, Value: team-hub }
        - { Key: env, Value: !Ref Env }

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}"
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt SiteBucket.Arn, !Sub "${SiteBucket.Arn}/*"]
            Condition: { Bool: { "aws:SecureTransport": "false" } }

  # ---------- Sign-in (Phase 1) ----------
  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub "${AppPrefix}-${Env}-users"
      UserPoolTier: LITE
      DeletionProtection: !If [IsProd, ACTIVE, INACTIVE]
      UsernameAttributes: [email]
      UsernameConfiguration: { CaseSensitive: false }
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig: { AllowAdminCreateUserOnly: false }
      AccountRecoverySetting:
        RecoveryMechanisms: [{ Name: verified_email, Priority: 1 }]
      Policies:
        PasswordPolicy:
          MinimumLength: 10
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
          TemporaryPasswordValidityDays: 7
      MfaConfiguration: "OFF"
      Schema:
        - { Name: email, AttributeDataType: String, Required: true, Mutable: true }
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
        EmailSubject: "Your A5 Team Hub code"
        EmailMessage: "Your A5 Team Hub verification code is {####}. It expires in 24 hours."
      EmailConfiguration: !If
        - UseSes
        - EmailSendingAccount: DEVELOPER
          From: !Sub "A5 Team Hub <${SesFromEmail}>"
          SourceArn: !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/${SesFromEmail}"
        - EmailSendingAccount: COGNITO_DEFAULT
      UserPoolTags:
        app: team-hub
        env: !Ref Env

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${AppPrefix}-${Env}-web"
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_SRP_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits: { AccessToken: minutes, IdToken: minutes, RefreshToken: days }
      SupportedIdentityProviders: [COGNITO]

  PreSignUpFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        OutExtension: [.js=.mjs]
        Target: es2022
        Minify: true
        Sourcemap: true
        EntryPoints: [src/auth-triggers/pre-sign-up.ts]
        External: ["@aws-sdk/*"]
    Properties:
      Description: Allows sign-up only for invited emails and club admins.
      CodeUri: api/
      Handler: pre-sign-up.handler
      Environment:
        Variables:
          CLUB_ADMIN_EMAILS: !Ref ClubAdminEmails
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref TeamHubTable }
      Events:
        CognitoPreSignUp:
          Type: Cognito
          Properties:
            UserPool: !Ref UserPool
            Trigger: PreSignUp

  PostConfirmationFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        OutExtension: [.js=.mjs]
        Target: es2022
        Minify: true
        Sourcemap: true
        EntryPoints: [src/auth-triggers/post-confirmation.ts]
        External: ["@aws-sdk/*"]
    Properties:
      Description: Turns invites into team memberships once an email is verified.
      CodeUri: api/
      Handler: post-confirmation.handler
      Environment:
        Variables:
          CLUB_ID: !Ref ClubId
          CLUB_ADMIN_EMAILS: !Ref ClubAdminEmails
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref TeamHubTable }
      Events:
        CognitoPostConfirmation:
          Type: Cognito
          Properties:
            UserPool: !Ref UserPool
            Trigger: PostConfirmation

  PreSignUpLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${PreSignUpFunction}"
      RetentionInDays: 30

  PostConfirmationLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${PostConfirmationFunction}"
      RetentionInDays: 30

  # ---------- API (Phase 2) ----------
  ApiAccessLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/apigateway/${AppPrefix}-${Env}-api"
      RetentionInDays: 30

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      Auth:
        DefaultAuthorizer: CognitoJwt
        Authorizers:
          CognitoJwt:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
              audience: [!Ref UserPoolClient]
      CorsConfiguration:
        AllowOrigins:
          - !Sub "https://${SiteDistribution.DomainName}"
          - !If [IsProd, !Ref AWS::NoValue, "http://localhost:5173"]
        AllowHeaders: [authorization, content-type]
        AllowMethods: [GET, POST, PUT, DELETE, OPTIONS]
        MaxAge: 600
      DefaultRouteSettings:
        ThrottlingBurstLimit: 100
        ThrottlingRateLimit: 50
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogs.Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","time":"$context.requestTime","method":"$context.httpMethod","path":"$context.path","status":"$context.status","latencyMs":"$context.responseLatency","sub":"$context.authorizer.claims.sub","error":"$context.authorizer.error"}'
      Tags:
        app: team-hub
        env: !Ref Env

  ApiFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        OutExtension: [.js=.mjs]
        Target: es2022
        Minify: true
        Sourcemap: true
        EntryPoints: [src/api/handler.ts]
        External: ["@aws-sdk/*"]
    Properties:
      Description: Team Hub REST API. Checks the caller's team roles before every read and write.
      CodeUri: api/
      Handler: handler.handler
      MemorySize: 512
      Environment:
        Variables:
          CLUB_ID: !Ref ClubId
          CLUB_ADMIN_EMAILS: !Ref ClubAdminEmails
          NODE_OPTIONS: --enable-source-maps
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref TeamHubTable }
      # One route per method (not ANY): browsers send CORS preflight OPTIONS requests without a
      # token, and an ANY route would send them to the JWT authorizer and fail. With no OPTIONS
      # route, API Gateway answers preflights itself from CorsConfiguration.
      Events:
        ApiGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: GET
        ApiPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: POST
        ApiPut:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: PUT
        ApiDelete:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: DELETE

  ApiFunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ApiFunction}"
      RetentionInDays: 30

  ApiErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AppPrefix}-${Env}-api-5xx"
      AlarmDescription: The Team Hub API returned server errors.
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions: [{ Name: ApiId, Value: !Ref HttpApi }, { Name: Stage, Value: $default }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  # ---------- Cost guardrail ----------
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Condition: HasAlertEmail
    Properties:
      Budget:
        BudgetName: !Sub "${AppPrefix}-${Env}-monthly"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: { Amount: !Ref MonthlyBudgetUsd, Unit: USD }
      NotificationsWithSubscribers:
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 80 }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]
        - Notification: { NotificationType: FORECASTED, ComparisonOperator: GREATER_THAN, Threshold: 100 }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]

Outputs:
  SiteUrl:
    Description: Where the site is served until a custom domain is added.
    Value: !Sub "https://${SiteDistribution.DomainName}"
  SiteBucketName:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref SiteDistribution
  TableName:
    Value: !Ref TeamHubTable
  TableStreamArn:
    Value: !GetAtt TeamHubTable.StreamArn
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  ApiUrl:
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
