AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Team Hub (TMA) application stack. Phase 0: data table, private site bucket and CloudFront.
  Later phases add Cognito, the HTTP API, WebSocket API and stream fan-out to this template.

Parameters:
  Env:
    Type: String
    AllowedValues: [dev, prod]
    Description: Deployment environment.
  AppPrefix:
    Type: String
    Default: tma
    Description: Must match the bootstrap stack's AppPrefix.
  AlertEmail:
    Type: String
    Default: ""
    Description: Optional. Email for the monthly budget alert. Leave empty to skip the budget.
  MonthlyBudgetUsd:
    Type: Number
    Default: 20
    MinValue: 1
  ClubId:
    Type: String
    Default: a5
    Description: Club id used in keys (CLUB#<id>).
  ClubAdminEmails:
    Type: String
    Default: ""
    Description: >
      Comma-separated emails that may sign up without an invite and become admins of the default club (ClubId).
      Applied once per person (R17): removing someone's admin record removes their rights for good.
  PlatformAdminEmails:
    Type: String
    Default: ""
    Description: >
      Comma-separated emails of site owners, who can add clubs and act as an admin of any club.
      Applied once per person, like ClubAdminEmails. Empty means no one is made a site owner from a list.
  SesFromEmail:
    Type: String
    Default: ""
    Description: >
      Optional. The address sign-in emails come from, on the domain verified in Amazon SES by the
      domain stack (R10), like noreply@teemhub.net. Empty uses Cognito's built-in sender (fine for
      testing, about 50 emails a day). SES must be out of its sandbox first.
  EmailSenderName:
    Type: String
    Default: Teem Hub
    Description: >
      The name sign-in emails come from and use in their subject and text. Dev adds " (dev)".
      One user pool serves every club, so this names the site, not a club.
  DomainStack:
    Type: String
    Default: ""
    Description: >
      Optional. The domain stack's name (bootstrap/domain.yaml, normally tma-domain), deployed with
      its certificate. With it, the site, API and live updates get the addresses below.
  SiteDomain:
    Type: String
    Default: ""
    Description: The site's address in the domain, like dev.teemhub.net or teemhub.net. Needs DomainStack.
  ApiDomain:
    Type: String
    Default: ""
    Description: The API's address, like api-dev.teemhub.net. Needs DomainStack.
  WsDomain:
    Type: String
    Default: ""
    Description: The live-updates address, like ws-dev.teemhub.net. Needs DomainStack.

Conditions:
  IsProd: !Equals [!Ref Env, prod]
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]
  UseSes: !Not [!Equals [!Ref SesFromEmail, ""]]
  HasDomain: !Not [!Equals [!Ref DomainStack, ""]]

Globals:
  Function:
    Runtime: nodejs24.x
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 10
    Tracing: Active
    # Required by this environment's execution role on every role the stack creates (bootstrap/github-oidc.yaml).
    PermissionsBoundary: !Sub "arn:aws:iam::${AWS::AccountId}:policy/${AppPrefix}-${Env}-boundary"
    Environment:
      Variables:
        TABLE_NAME: !Ref TeamHubTable
        ENV: !Ref Env

Resources:
  # ---------- Data ----------
  TeamHubTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "TeamHub-${Env}"
      BillingMode: PAY_PER_REQUEST
      TableClass: STANDARD
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
        - { AttributeName: GSI1PK, AttributeType: S }
        - { AttributeName: GSI1SK, AttributeType: S }
        - { AttributeName: GSI2PK, AttributeType: S }
        - { AttributeName: GSI2SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - { AttributeName: GSI1PK, KeyType: HASH }
            - { AttributeName: GSI1SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
        - IndexName: GSI2
          KeySchema:
            - { AttributeName: GSI2PK, KeyType: HASH }
            - { AttributeName: GSI2SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      StreamSpecification: { StreamViewType: NEW_AND_OLD_IMAGES }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      TimeToLiveSpecification: { AttributeName: ttl, Enabled: true }
      SSESpecification: { SSEEnabled: true, SSEType: KMS }
      DeletionProtectionEnabled: !If [IsProd, true, false]
      Tags:
        - { Key: app, Value: team-hub }
        - { Key: env, Value: !Ref Env }

  # ---------- Static site ----------
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${AppPrefix}-${Env}-site-${AWS::AccountId}"
      OwnershipControls: { Rules: [{ ObjectOwnership: BucketOwnerEnforced }] }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      VersioningConfiguration: { Status: Enabled }
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-versions
            Status: Enabled
            NoncurrentVersionExpiration: { NoncurrentDays: 30 }
      Tags:
        - { Key: app, Value: team-hub }
        - { Key: env, Value: !Ref Env }

  SiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AppPrefix}-${Env}-site-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub "Team Hub ${Env}"
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        DefaultRootObject: index.html
        Aliases: !If [HasDomain, [!Ref SiteDomain], !Ref AWS::NoValue]
        ViewerCertificate: !If
          - HasDomain
          - AcmCertificateArn: { "Fn::ImportValue": !Sub "${DomainStack}-CertificateArn" }
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - !Ref AWS::NoValue
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOriginAccessControl.Id
            S3OriginConfig: { OriginAccessIdentity: "" }
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          # Managed policy CachingOptimized; our own security headers with the CSP (R6).
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref SiteHeaders
        CustomErrorResponses:
          # Single-page app: unknown paths serve index.html
          - { ErrorCode: 403, ResponseCode: 200, ResponsePagePath: /index.html, ErrorCachingMinTTL: 0 }
          - { ErrorCode: 404, ResponseCode: 200, ResponsePagePath: /index.html, ErrorCachingMinTTL: 0 }
      Tags:
        - { Key: app, Value: team-hub }
        - { Key: env, Value: !Ref Env }

  # Security headers for the site (R6), replacing the managed SecurityHeadersPolicy. The CSP lets
  # the page run only its own scripts and talk only to itself, API Gateway and Cognito. API Gateway
  # is allowed by its regional domain because naming our API here would be a circular reference
  # (the API's CORS settings name this distribution). scripts/check-csp.mjs checks the built site
  # against it, and the local preview serves the same policy.
  SiteHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${AppPrefix}-${Env}-site-headers"
        Comment: !Sub "Team Hub ${Env}: security headers and CSP (R6)"
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: !Sub
              - >-
                default-src 'self';
                script-src 'self';
                style-src 'self' 'unsafe-inline';
                img-src 'self' data:;
                font-src 'self';
                connect-src 'self' https://cognito-idp.${AWS::Region}.amazonaws.com ${ApiOrigins};
                object-src 'none';
                base-uri 'self';
                form-action 'self';
                frame-ancestors 'none';
                upgrade-insecure-requests;
                report-uri ${CspReportFunctionUrl.FunctionUrl}
              # With the domain, only our own API and live-updates addresses. Without it, API Gateway's
              # regional domain (naming our API here would be a circular reference).
              - ApiOrigins: !If
                  - HasDomain
                  - !Sub "https://${ApiDomain} wss://${WsDomain}"
                  - !Sub "https://*.execute-api.${AWS::Region}.amazonaws.com wss://*.execute-api.${AWS::Region}.amazonaws.com"
          ContentTypeOptions: { Override: true }
          FrameOptions: { FrameOption: DENY, Override: true }
          ReferrerPolicy: { ReferrerPolicy: strict-origin-when-cross-origin, Override: true }
          StrictTransportSecurity: { AccessControlMaxAgeSec: 31536000, IncludeSubdomains: true, Override: true }
        CustomHeadersConfig:
          Items:
            - { Header: Permissions-Policy, Value: "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()", Override: true }
            - { Header: Cross-Origin-Opener-Policy, Value: same-origin, Override: true }

  # Browsers send a report here whenever the CSP blocks something; each lands in CloudWatch.
  # Public by design (browsers can't sign in to send reports): it only logs a trimmed summary.
  CspReportFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        OutExtension: [.js=.mjs]
        Target: es2022
        Minify: true
        Sourcemap: true
        EntryPoints: [src/jobs/csp-report.ts]
        External: ["@aws-sdk/*"]
    Properties:
      Description: Logs Content-Security-Policy violation reports from browsers (R6).
      CodeUri: api/
      Handler: csp-report.handler
      MemorySize: 128
      Timeout: 3
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins: ["*"]
          AllowMethods: [POST]
          AllowHeaders: [content-type]
          MaxAge: 600
      # The CSP uses report-uri, which Chrome, Firefox and Safari all send here.

  CspReportFunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${CspReportFunction}"
      RetentionInDays: 30

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}"
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt SiteBucket.Arn, !Sub "${SiteBucket.Arn}/*"]
            Condition: { Bool: { "aws:SecureTransport": "false" } }

  # ---------- Sign-in (Phase 1) ----------
  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub "${AppPrefix}-${Env}-users"
      UserPoolTier: LITE
      DeletionProtection: !If [IsProd, ACTIVE, INACTIVE]
      UsernameAttributes: [email]
      UsernameConfiguration: { CaseSensitive: false }
      AutoVerifiedAttributes: [email]
      # R5: an email change waits until the new address is confirmed with a code. The site offers no
      # way to change email, and the API only trusts the address verified at sign-up.
      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate: [email]
      AdminCreateUserConfig: { AllowAdminCreateUserOnly: false }
      AccountRecoverySetting:
        RecoveryMechanisms: [{ Name: verified_email, Priority: 1 }]
      Policies:
        PasswordPolicy:
          MinimumLength: 10
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
          TemporaryPasswordValidityDays: 7
      # Two-step sign-in (R2): anyone may turn on an authenticator app, and from then on Cognito asks
      # for a code at every sign-in. The API grants club-admin and site-owner rights only to people
      # who have it on. No text-message codes, and no "remember this device".
      MfaConfiguration: "OPTIONAL"
      EnabledMfas: [SOFTWARE_TOKEN_MFA]
      Schema:
        - { Name: email, AttributeDataType: String, Required: true, Mutable: true }
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
        EmailSubject: !Sub
          - "Your ${Name} code"
          - Name: !If [IsProd, !Ref EmailSenderName, !Sub "${EmailSenderName} (dev)"]
        EmailMessage: !Sub
          - "Your ${Name} verification code is {####}. It expires in 24 hours."
          - Name: !If [IsProd, !Ref EmailSenderName, !Sub "${EmailSenderName} (dev)"]
      EmailConfiguration: !If
        - UseSes
        # The SES identity is the whole domain (noreply@teemhub.net → teemhub.net), verified by the
        # domain stack. Cognito sends through its own service-linked role, created on first use.
        - EmailSendingAccount: DEVELOPER
          From: !Sub
            - "${Name} <${SesFromEmail}>"
            - Name: !If [IsProd, !Ref EmailSenderName, !Sub "${EmailSenderName} (dev)"]
          SourceArn: !Sub
            - "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/${Domain}"
            - Domain: !Select [1, !Split ["@", !Ref SesFromEmail]]
        - EmailSendingAccount: COGNITO_DEFAULT
      UserPoolTags:
        app: team-hub
        env: !Ref Env

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${AppPrefix}-${Env}-web"
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_SRP_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 60
      IdTokenValidity: 60
      # R6: signed in for at most 7 days, then sign in again (the 1-hour tokens refresh until then).
      RefreshTokenValidity: 7
      TokenValidityUnits: { AccessToken: minutes, IdToken: minutes, RefreshToken: days }
      SupportedIdentityProviders: [COGNITO]

  PreSignUpFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        OutExtension: [.js=.mjs]
        Target: es2022
        Minify: true
        Sourcemap: true
        EntryPoints: [src/auth-triggers/pre-sign-up.ts]
        External: ["@aws-sdk/*"]
    Properties:
      Description: Allows sign-up only for invited emails and club admins.
      CodeUri: api/
      Handler: pre-sign-up.handler
      Environment:
        Variables:
          CLUB_ADMIN_EMAILS: !Ref ClubAdminEmails
          PLATFORM_ADMIN_EMAILS: !Ref PlatformAdminEmails
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref TeamHubTable }
      Events:
        CognitoPreSignUp:
          Type: Cognito
          Properties:
            UserPool: !Ref UserPool
            Trigger: PreSignUp

  PostConfirmationFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        OutExtension: [.js=.mjs]
        Target: es2022
        Minify: true
        Sourcemap: true
        EntryPoints: [src/auth-triggers/post-confirmation.ts]
        External: ["@aws-sdk/*"]
    Properties:
      Description: Turns invites into team memberships once an email is verified.
      CodeUri: api/
      Handler: post-confirmation.handler
      Environment:
        Variables:
          CLUB_ID: !Ref ClubId
          CLUB_ADMIN_EMAILS: !Ref ClubAdminEmails
          PLATFORM_ADMIN_EMAILS: !Ref PlatformAdminEmails
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref TeamHubTable }
      Events:
        CognitoPostConfirmation:
          Type: Cognito
          Properties:
            UserPool: !Ref UserPool
            Trigger: PostConfirmation

  PreSignUpLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${PreSignUpFunction}"
      RetentionInDays: 30

  PostConfirmationLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${PostConfirmationFunction}"
      RetentionInDays: 30

  # ---------- API (Phase 2) ----------
  ApiAccessLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/apigateway/${AppPrefix}-${Env}-api"
      RetentionInDays: 30

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      Auth:
        DefaultAuthorizer: CognitoJwt
        Authorizers:
          CognitoJwt:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
              audience: [!Ref UserPoolClient]
      CorsConfiguration:
        AllowOrigins:
          - !Sub "https://${SiteDistribution.DomainName}"
          - !If [HasDomain, !Sub "https://${SiteDomain}", !Ref AWS::NoValue]
          - !If [IsProd, !Ref AWS::NoValue, "http://localhost:4200"]
        AllowHeaders: [authorization, content-type]
        AllowMethods: [GET, POST, PUT, DELETE, OPTIONS]
        MaxAge: 600
      DefaultRouteSettings:
        ThrottlingBurstLimit: 100
        ThrottlingRateLimit: 50
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogs.Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","time":"$context.requestTime","method":"$context.httpMethod","path":"$context.path","status":"$context.status","latencyMs":"$context.responseLatency","sub":"$context.authorizer.claims.sub","error":"$context.authorizer.error"}'
      Tags:
        app: team-hub
        env: !Ref Env

  ApiFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        OutExtension: [.js=.mjs]
        Target: es2022
        Minify: true
        Sourcemap: true
        EntryPoints: [src/api/handler.ts]
        External: ["@aws-sdk/*"]
    Properties:
      Description: Team Hub REST API. Checks the caller's team roles before every read and write.
      CodeUri: api/
      Handler: handler.handler
      MemorySize: 512
      # Spreadsheet previews read every team in a club; the HTTP API itself stops waiting at 30 seconds.
      Timeout: 29
      Environment:
        Variables:
          CLUB_ID: !Ref ClubId
          CLUB_ADMIN_EMAILS: !Ref ClubAdminEmails
          PLATFORM_ADMIN_EMAILS: !Ref PlatformAdminEmails
          USER_POOL_ID: !Ref UserPool
          NODE_OPTIONS: --enable-source-maps
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref TeamHubTable }
        # Is two-step sign-in on (club-admin and site-owner rights), the site owner's reset for a lost
        # phone, and Delete my account (R4).
        - Statement:
            - Effect: Allow
              Action: [cognito-idp:AdminGetUser, cognito-idp:AdminSetUserMFAPreference, cognito-idp:AdminDeleteUser]
              Resource: !GetAtt UserPool.Arn
      # One route per method (not ANY): browsers send CORS preflight OPTIONS requests without a
      # token, and an ANY route would send them to the JWT authorizer and fail. With no OPTIONS
      # route, API Gateway answers preflights itself from CorsConfiguration.
      Events:
        ApiGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: GET
        ApiPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: POST
        ApiPut:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: PUT
        ApiDelete:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: DELETE

  ApiFunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ApiFunction}"
      RetentionInDays: 30

  ApiErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AppPrefix}-${Env}-api-5xx"
      AlarmDescription: The Team Hub API returned server errors.
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions: [{ Name: ApiId, Value: !Ref HttpApi }, { Name: Stage, Value: $default }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  # ---------- Realtime: WebSocket push (Phase 3) ----------
  # Browsers connect to wss://.../live?token=<Cognito access token> and send {"action":"subscribe","teamId":...}.
  # When anything in a team's partition changes, the stream fan-out sends that team's sockets a short
  # {"type":"changed","collections":[...]} notice; browsers then re-read through the REST API, so every
  # permission check stays in one place and no team data travels over the socket.
  WebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${AppPrefix}-${Env}-ws"
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: $request.body.action
      Tags:
        app: team-hub
        env: !Ref Env

  WsAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref WebSocketApi
      Name: cognito-access-token
      AuthorizerType: REQUEST
      IdentitySource: [route.request.querystring.token]
      AuthorizerUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WsAuthorizerFunction.Arn}/invocations"

  WsAuthorizerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WsAuthorizerFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/authorizers/${WsAuthorizer}"

  WsConnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WsConnectFunction.Arn}/invocations"

  WsConnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WsConnectFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*"

  WsDisconnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WsDisconnectFunction.Arn}/invocations"

  WsDisconnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WsDisconnectFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*"

  WsMessagesIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WsMessagesFunction.Arn}/invocations"

  WsMessagesPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WsMessagesFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*"

  WsConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: "$connect"
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref WsAuthorizer
      Target: !Sub "integrations/${WsConnectIntegration}"

  WsDisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: "$disconnect"
      AuthorizationType: NONE
      Target: !Sub "integrations/${WsDisconnectIntegration}"

  WsSubscribeRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: "subscribe"
      AuthorizationType: NONE
      Target: !Sub "integrations/${WsMessagesIntegration}"

  WsPingRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: "ping"
      AuthorizationType: NONE
      Target: !Sub "integrations/${WsMessagesIntegration}"

  WsDefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: "$default"
      AuthorizationType: NONE
      Target: !Sub "integrations/${WsMessagesIntegration}"

  WebSocketStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref WebSocketApi
      StageName: live
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 100
        ThrottlingRateLimit: 50

  WsAuthorizerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        OutExtension: [.js=.mjs]
        Target: es2022
        Minify: true
        Sourcemap: true
        EntryPoints: [src/realtime/authorizer.ts]
        External: ["@aws-sdk/*"]
    Properties:
      Description: Checks the Cognito access token on WebSocket connect.
      CodeUri: api/
      Handler: authorizer.handler
      Environment:
        Variables:
          USER_POOL_ID: !Ref UserPool
          USER_POOL_CLIENT_ID: !Ref UserPoolClient
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref TeamHubTable }

  WsAuthorizerFunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${WsAuthorizerFunction}"
      RetentionInDays: 30

  WsConnectFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        OutExtension: [.js=.mjs]
        Target: es2022
        Minify: true
        Sourcemap: true
        EntryPoints: [src/realtime/connect.ts]
        External: ["@aws-sdk/*"]
    Properties:
      Description: Records a new WebSocket connection.
      CodeUri: api/
      Handler: connect.handler
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref TeamHubTable }

  WsConnectFunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${WsConnectFunction}"
      RetentionInDays: 30

  WsDisconnectFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        OutExtension: [.js=.mjs]
        Target: es2022
        Minify: true
        Sourcemap: true
        EntryPoints: [src/realtime/disconnect.ts]
        External: ["@aws-sdk/*"]
    Properties:
      Description: Forgets a closed WebSocket connection.
      CodeUri: api/
      Handler: disconnect.handler
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref TeamHubTable }

  WsDisconnectFunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${WsDisconnectFunction}"
      RetentionInDays: 30

  WsMessagesFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        OutExtension: [.js=.mjs]
        Target: es2022
        Minify: true
        Sourcemap: true
        EntryPoints: [src/realtime/messages.ts]
        External: ["@aws-sdk/*"]
    Properties:
      Description: Handles subscribe and ping messages on the WebSocket.
      CodeUri: api/
      Handler: messages.handler
      Environment:
        Variables:
          # Replies go to the API's own address: with the custom domain, the browser's address
          # (ws-dev.teemhub.net) has no stage in its path.
          WS_ENDPOINT: !Sub "https://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/live"
          CLUB_ID: !Ref ClubId
          CLUB_ADMIN_EMAILS: !Ref ClubAdminEmails
          PLATFORM_ADMIN_EMAILS: !Ref PlatformAdminEmails
          USER_POOL_ID: !Ref UserPool
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref TeamHubTable }
        # Subscribing uses the API's access check, which asks Cognito whether two-step sign-in is on (R2).
        - Statement:
            - Effect: Allow
              Action: cognito-idp:AdminGetUser
              Resource: !GetAtt UserPool.Arn
        - Statement:
            - Effect: Allow
              Action: execute-api:ManageConnections
              Resource: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/live/POST/@connections/*"

  WsMessagesFunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${WsMessagesFunction}"
      RetentionInDays: 30

  FanoutFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        OutExtension: [.js=.mjs]
        Target: es2022
        Minify: true
        Sourcemap: true
        EntryPoints: [src/realtime/fanout.ts]
        External: ["@aws-sdk/*"]
    Properties:
      Description: Tells a team's open sockets which collections changed, from the table stream.
      CodeUri: api/
      Handler: fanout.handler
      Environment:
        Variables:
          WS_ENDPOINT: !Sub "https://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/live"
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref TeamHubTable }
        - Statement:
            - Effect: Allow
              Action: execute-api:ManageConnections
              Resource: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/live/POST/@connections/*"
      Timeout: 60
      Events:
        TableStream:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt TeamHubTable.StreamArn
            StartingPosition: LATEST
            BatchSize: 100
            MaximumBatchingWindowInSeconds: 1
            BisectBatchOnFunctionError: true
            MaximumRetryAttempts: 3
            MaximumRecordAgeInSeconds: 300
            FilterCriteria:
              Filters:
                - Pattern: '{"dynamodb":{"Keys":{"PK":{"S":[{"prefix":"TEAM#"}]}}}}'
                - Pattern: '{"dynamodb":{"Keys":{"PK":{"S":[{"prefix":"INVITE#"}]}}}}'

  # Retention (R4, R31): once a day, deletes teams archived 90 days ago, and teams whose
  # "Delete team" was 7 days ago and not undone. Rules live in api/src/lib/retention.ts.
  PurgeFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        OutExtension: [.js=.mjs]
        Target: es2022
        Minify: true
        Sourcemap: true
        EntryPoints: [src/jobs/purge.ts]
        External: ["@aws-sdk/*"]
    Properties:
      Description: Deletes archived teams when their retention period ends.
      CodeUri: api/
      Handler: purge.handler
      Timeout: 300
      Environment:
        Variables:
          CLUB_ID: !Ref ClubId
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref TeamHubTable }
      Events:
        Daily:
          Type: Schedule
          Properties:
            Schedule: cron(15 8 * * ? *)
            Description: Team Hub retention, daily at 08:15 UTC

  PurgeFunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${PurgeFunction}"
      RetentionInDays: 30

  FanoutFunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${FanoutFunction}"
      RetentionInDays: 30

  FanoutIteratorAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AppPrefix}-${Env}-fanout-lag"
      AlarmDescription: Live updates are running more than a minute behind the table.
      Namespace: AWS/Lambda
      MetricName: IteratorAge
      Dimensions: [{ Name: FunctionName, Value: !Ref FanoutFunction }]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 60000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  FanoutErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AppPrefix}-${Env}-fanout-errors"
      AlarmDescription: The live-update fan-out function is failing.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref FanoutFunction }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  # ---------- Cost guardrail ----------
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Condition: HasAlertEmail
    Properties:
      Budget:
        BudgetName: !Sub "${AppPrefix}-${Env}-monthly"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: { Amount: !Ref MonthlyBudgetUsd, Unit: USD }
      NotificationsWithSubscribers:
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 80 }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]
        - Notification: { NotificationType: FORECASTED, ComparisonOperator: GREATER_THAN, Threshold: 100 }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]

  # ---------- Addresses in the domain (R10; bootstrap/domain.yaml has the zone and certificate) ----------
  SiteDnsRecords:
    Type: AWS::Route53::RecordSetGroup
    Condition: HasDomain
    Properties:
      HostedZoneId: { "Fn::ImportValue": !Sub "${DomainStack}-HostedZoneId" }
      RecordSets:
        # Z2FDTNDATAQYW2 is CloudFront's own hosted zone id, the same for every distribution.
        - { Name: !Ref SiteDomain, Type: A, AliasTarget: { DNSName: !GetAtt SiteDistribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2 } }
        - { Name: !Ref SiteDomain, Type: AAAA, AliasTarget: { DNSName: !GetAtt SiteDistribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2 } }

  ApiDomainName:
    Type: AWS::ApiGatewayV2::DomainName
    Condition: HasDomain
    Properties:
      DomainName: !Ref ApiDomain
      DomainNameConfigurations:
        - CertificateArn: { "Fn::ImportValue": !Sub "${DomainStack}-CertificateArn" }
          EndpointType: REGIONAL
          SecurityPolicy: TLS_1_2
      Tags: { app: team-hub, env: !Ref Env }

  ApiMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Condition: HasDomain
    DependsOn: HttpApiApiGatewayDefaultStage
    Properties:
      DomainName: !Ref ApiDomainName
      ApiId: !Ref HttpApi
      Stage: $default

  WsDomainName:
    Type: AWS::ApiGatewayV2::DomainName
    Condition: HasDomain
    Properties:
      DomainName: !Ref WsDomain
      DomainNameConfigurations:
        - CertificateArn: { "Fn::ImportValue": !Sub "${DomainStack}-CertificateArn" }
          EndpointType: REGIONAL
          SecurityPolicy: TLS_1_2
      Tags: { app: team-hub, env: !Ref Env }

  WsMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Condition: HasDomain
    Properties:
      DomainName: !Ref WsDomainName
      ApiId: !Ref WebSocketApi
      Stage: !Ref WebSocketStage

  ApiDnsRecords:
    Type: AWS::Route53::RecordSetGroup
    Condition: HasDomain
    Properties:
      HostedZoneId: { "Fn::ImportValue": !Sub "${DomainStack}-HostedZoneId" }
      RecordSets:
        - { Name: !Ref ApiDomain, Type: A, AliasTarget: { DNSName: !GetAtt ApiDomainName.RegionalDomainName, HostedZoneId: !GetAtt ApiDomainName.RegionalHostedZoneId } }
        - { Name: !Ref WsDomain, Type: A, AliasTarget: { DNSName: !GetAtt WsDomainName.RegionalDomainName, HostedZoneId: !GetAtt WsDomainName.RegionalHostedZoneId } }

Outputs:
  SiteUrl:
    Description: The site's address (its own domain once DomainStack is set).
    Value: !If [HasDomain, !Sub "https://${SiteDomain}", !Sub "https://${SiteDistribution.DomainName}"]
  SiteBucketName:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref SiteDistribution
  TableName:
    Value: !Ref TeamHubTable
  TableStreamArn:
    Value: !GetAtt TeamHubTable.StreamArn
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  CloudFrontUrl:
    Description: The distribution's own address, which keeps working alongside the domain.
    Value: !Sub "https://${SiteDistribution.DomainName}"
  ApiUrl:
    Value: !If [HasDomain, !Sub "https://${ApiDomain}", !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"]
  WsUrl:
    # A custom domain maps straight to the "live" stage, so its address has no /live.
    Value: !If [HasDomain, !Sub "wss://${WsDomain}", !Sub "wss://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/live"]
