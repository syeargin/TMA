name: Deploy

# main   -> dev  (automatic)
# release published -> prod (waits for approval on the "prod" environment)
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  id-token: write   # OIDC token for AWS
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "774924543698"

jobs:
  deploy:
    name: Deploy ${{ github.event_name == 'release' && 'prod' || inputs.environment || 'dev' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'release' && 'prod' || inputs.environment || 'dev' }}
    concurrency:
      group: deploy-${{ github.event_name == 'release' && 'prod' || inputs.environment || 'dev' }}
      cancel-in-progress: false
    env:
      DEPLOY_ENV: ${{ github.event_name == 'release' && 'prod' || inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/tma-github-deploy-${{ env.DEPLOY_ENV }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: tma-${{ env.DEPLOY_ENV }}-${{ github.run_id }}

      # Runs only if AWS rejected the sign-in: prints the identity claims GitHub sent
      # (not the token) so they can be compared with the deploy role's trust policy.
      - name: Show OIDC claims on sign-in failure
        if: failure()
        run: |
          token=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          python3 - "$token" <<'PY'
          import base64, json, sys
          part = sys.argv[1].split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(part + "=" * (-len(part) % 4)))
          keep = ["sub", "aud", "repository", "repository_owner", "environment", "ref", "job_workflow_ref"]
          print(json.dumps({k: claims.get(k) for k in keep}, indent=2))
          print("Expected sub: repo:syeargin/TMA:environment:" + claims.get("environment", "?"))
          PY

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            api/package-lock.json

      - name: Build stack
        run: |
          npm install -g esbuild@0.25
          (cd api && npm ci)
          sam build --template template.yaml

      - name: Deploy stack
        run: sam deploy --config-env "$DEPLOY_ENV" --no-progressbar

      - name: Read stack outputs
        id: out
        run: |
          stack="tma-$DEPLOY_ENV"
          get() { aws cloudformation describe-stacks --stack-name "$stack" \
                    --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text; }
          {
            echo "bucket=$(get SiteBucketName)"
            echo "distribution=$(get DistributionId)"
            echo "url=$(get SiteUrl)"
            echo "user_pool=$(get UserPoolId)"
            echo "client=$(get UserPoolClientId)"
            echo "api=$(get ApiUrl)"
          } >> "$GITHUB_OUTPUT"

      - name: Build site
        working-directory: web
        env:
          USER_POOL_ID: ${{ steps.out.outputs.user_pool }}
          CLIENT_ID: ${{ steps.out.outputs.client }}
          API_URL: ${{ steps.out.outputs.api }}
        run: |
          npm ci
          jq -n --arg env "$DEPLOY_ENV" --arg commit "$GITHUB_SHA" --arg region "$AWS_REGION" \
                --arg pool "$USER_POOL_ID" --arg client "$CLIENT_ID" --arg api "$API_URL" \
                '{env: $env, commit: $commit, region: $region, userPoolId: $pool, userPoolClientId: $client, apiUrl: $api}' > public/config.json
          cat public/config.json
          npm run build

      - name: Upload site
        working-directory: web/dist
        env:
          BUCKET: ${{ steps.out.outputs.bucket }}
        run: |
          # Hashed assets: cache for a year. Everything else: always revalidate.
          aws s3 sync assets "s3://$BUCKET/assets" --delete --cache-control "public,max-age=31536000,immutable"
          aws s3 sync . "s3://$BUCKET" --delete --exclude "assets/*" --cache-control "no-cache"

      - name: Refresh CloudFront
        env:
          DIST: ${{ steps.out.outputs.distribution }}
        run: aws cloudfront create-invalidation --distribution-id "$DIST" --paths "/index.html" "/config.json" >/dev/null

      - name: Smoke test
        env:
          URL: ${{ steps.out.outputs.url }}
        run: |
          for _ in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/config.json") || true
            [ "$code" = "200" ] && curl -s "$URL/config.json" | grep -q "$GITHUB_SHA" && { echo "Live: $URL"; exit 0; }
            echo "Waiting for CloudFront ($code)…"; sleep 20
          done
          echo "Site did not serve this build" >&2; exit 1

      - name: API preflight check
        env:
          URL: ${{ steps.out.outputs.url }}
          API: ${{ steps.out.outputs.api }}
        run: |
          # Browsers send this before every API call; it must succeed without a token.
          headers=$(curl -s -o /dev/null -D - -X OPTIONS "$API/me" \
            -H "Origin: $URL" -H "Access-Control-Request-Method: GET" \
            -H "Access-Control-Request-Headers: authorization")
          echo "$headers" | head -1
          echo "$headers" | grep -qi "access-control-allow-origin: $URL" || { echo "CORS preflight failed for $URL" >&2; exit 1; }
          # A call without a token must be refused, not served.
          code=$(curl -s -o /dev/null -w '%{http_code}' "$API/me")
          [ "$code" = "401" ] || { echo "Expected 401 without a token, got $code" >&2; exit 1; }
          echo "API preflight and auth OK"

      - name: Summary
        run: echo "### Deployed to $DEPLOY_ENV → ${{ steps.out.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
