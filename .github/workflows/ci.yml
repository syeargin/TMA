name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  infra:
    name: Validate infrastructure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: aws-actions/setup-sam@f84ec7d548307efafe33230528756de3c5841a17 # v2
        with:
          use-installer: true
          version: 1.174.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install cfn-lint and the API's packages
        # esbuild comes from api/package-lock.json (R7): SAM finds it on the PATH.
        run: |
          pip install "cfn-lint==1.61.0"
          (cd api && npm ci)
          echo "$PWD/api/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Validate app template
        run: sam validate --lint --template template.yaml --region us-east-1
      - name: Lint bootstrap template
        run: cfn-lint bootstrap/github-oidc.yaml
      - name: Check environments stay apart
        run: python3 bootstrap/check.py
      - name: Build
        run: sam build --template template.yaml

  api:
    name: Test API
    runs-on: ubuntu-latest
    env:
      DYNAMODB_ENDPOINT: http://127.0.0.1:8000
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      # A local DynamoDB for the tests: moto at a pinned version, the same server used on a laptop.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Start moto
        run: |
          pip install "moto[server]==5.2.4"
          (moto_server -H 127.0.0.1 -p 8000 > /tmp/moto.log 2>&1 &)
          for _ in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:8000 && exit 0; sleep 1; done
          cat /tmp/moto.log; exit 1
      - run: npm ci
      - name: Check dependencies (R7)
        run: |
          npm audit --audit-level=high
          npm audit signatures
      - run: npm run typecheck
      - run: npm test

  web:
    name: Build site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Check dependencies (R7, R33)
        run: |
          npm audit --audit-level=high
          npm audit signatures
      - run: npm test
      - run: npm run build
      - name: Check the site against the CSP (R6)
        run: node ../scripts/check-csp.mjs
