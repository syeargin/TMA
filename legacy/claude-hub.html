<title>A5 13 Tom Team Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=Big+Shoulders+Display:wght@700;800;900&display=swap">
<style>
:root{
  --bg:#EDF0F5; --surface:#FFFFFF; --surface-2:#F6F8FB; --sunken:#E3E8F0;
  --ink:#101B2E; --ink-2:#47546C; --ink-3:#6C7890; --line:#D5DBE5; --line-2:#E6EAF1;
  --navy:#15294D; --accent:#C8323E; --accent-ink:#FFFFFF; --accent-soft:#FBE6E8;
  --btn:#15294D; --btn-ink:#FFFFFF; --btn-soft:#E3E9F4;
  --ok:#17744A; --ok-soft:#DFF2E8; --warn:#8F5C05; --warn-soft:#FAEFD6; --bad:#B42318; --bad-soft:#FDE7E4;
  --hdr:#15294D; --hdr-2:#0F1F3C; --hdr-ink:#F4F6FA; --hdr-mute:#A8B6CF; --line-court:rgba(255,255,255,.10);
  --shadow:0 1px 2px rgba(16,27,46,.05),0 6px 18px rgba(16,27,46,.06);
  --r:12px;
  --f-display:"Big Shoulders Display","Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-cond:"Barlow Condensed","Arial Narrow",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0A111E; --surface:#111A2B; --surface-2:#15203340; --sunken:#0C1422;
    --ink:#E6EBF3; --ink-2:#A6B2C7; --ink-3:#7E8BA3; --line:#243249; --line-2:#1B2739;
    --navy:#A9C1EE; --accent:#F0616B; --accent-ink:#1B0609; --accent-soft:#3A161A;
    --btn:#A9C1EE; --btn-ink:#0A111E; --btn-soft:#1C2A44;
    --ok:#56C893; --ok-soft:#0F2E20; --warn:#E6B552; --warn-soft:#30240C; --bad:#F87A6F; --bad-soft:#3A1613;
    --hdr:#0E1A31; --hdr-2:#0A1426; --hdr-ink:#F1F4F9; --hdr-mute:#8C9CBB;
    --shadow:0 1px 0 rgba(255,255,255,.03);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0A111E; --surface:#111A2B; --surface-2:#15203340; --sunken:#0C1422;
  --ink:#E6EBF3; --ink-2:#A6B2C7; --ink-3:#7E8BA3; --line:#243249; --line-2:#1B2739;
  --navy:#A9C1EE; --accent:#F0616B; --accent-ink:#1B0609; --accent-soft:#3A161A;
  --btn:#A9C1EE; --btn-ink:#0A111E; --btn-soft:#1C2A44;
  --ok:#56C893; --ok-soft:#0F2E20; --warn:#E6B552; --warn-soft:#30240C; --bad:#F87A6F; --bad-soft:#3A1613;
  --hdr:#0E1A31; --hdr-2:#0A1426; --hdr-ink:#F1F4F9; --hdr-mute:#8C9CBB;
  --shadow:0 1px 0 rgba(255,255,255,.03);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:var(--navy);text-underline-offset:2px}
button{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;text-wrap:balance}
.tn{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.label{font-family:var(--f-cond);font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-size:12.5px;color:var(--ink-3)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ---------- header ---------- */
.hdr{background:var(--hdr);color:var(--hdr-ink);position:relative;overflow:hidden}
.hdr::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:
   linear-gradient(90deg,transparent calc(50% - 1px),var(--line-court) calc(50% - 1px),var(--line-court) calc(50% + 1px),transparent calc(50% + 1px)),
   linear-gradient(90deg,transparent 33.3%,var(--line-court) 33.3%,var(--line-court) calc(33.3% + 1px),transparent calc(33.3% + 1px),transparent 66.6%,var(--line-court) 66.6%,var(--line-court) calc(66.6% + 1px),transparent calc(66.6% + 1px));}
.hdr::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--accent)}
.hdr-in{position:relative;max-width:1180px;margin:0 auto;padding:18px 16px 16px;display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.crest{width:52px;height:52px;flex:none}
.brand h1{font-family:var(--f-display);font-weight:900;font-size:34px;letter-spacing:.01em;line-height:.9;text-transform:uppercase}
.brand .sub{font-family:var(--f-cond);font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:13px;color:var(--hdr-mute);margin-top:4px}
.who{margin-left:auto;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:6px 8px 6px 14px;cursor:pointer;color:var(--hdr-ink);max-width:100%}
.who:hover{background:rgba(255,255,255,.14)}
.who .w-l{font-family:var(--f-cond);text-transform:uppercase;letter-spacing:.08em;font-size:11.5px;color:var(--hdr-mute);line-height:1}
.who .w-n{font-weight:600;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.who .w-c{background:var(--accent);color:#fff;border-radius:999px;font-size:12px;font-weight:600;padding:5px 10px;white-space:nowrap}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.tabs-in{max-width:1180px;margin:0 auto;display:flex;gap:2px;overflow-x:auto;padding:0 8px;scrollbar-width:none}
.tabs-in::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:none;padding:14px 12px 12px;font-family:var(--f-cond);font-weight:600;font-size:16px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

main{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:22px 64px}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);border-radius:var(--r);padding:12px 14px;margin-bottom:18px}
.banner.info{background:var(--btn-soft);border-color:var(--line)}
.banner p{margin:0;flex:1 1 240px}

/* ---------- layout ---------- */
.grid{display:grid;gap:18px}
.g-home{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:860px){.g-home,.g-2{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;flex-wrap:wrap}
.card-h h2,.card-h h3{font-family:var(--f-cond);font-weight:700;font-size:19px;text-transform:uppercase;letter-spacing:.04em}
.card-b{padding:4px 16px 16px}
.sec-h{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.sec-h h2{font-family:var(--f-display);font-weight:800;font-size:32px;text-transform:uppercase;line-height:1}
.sec-h p{margin:0}

/* ---------- buttons, chips ---------- */
.btn{appearance:none;border:1px solid transparent;border-radius:8px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;background:var(--btn-soft);color:var(--ink);text-decoration:none;line-height:1.2}
.btn:hover{filter:brightness(.97)}
.btn.primary{background:var(--btn);color:var(--btn-ink)}
.btn.red{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.danger-ghost{background:transparent;color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn.confirming{background:var(--bad);color:#fff}
.icon-btn{appearance:none;border:0;background:var(--btn-soft);width:32px;height:32px;border-radius:8px;font-size:20px;line-height:1;cursor:pointer;color:var(--ink)}
.link-btn{appearance:none;border:0;background:none;padding:0;color:var(--navy);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:2px;font-size:inherit}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;font-family:var(--f-body);white-space:nowrap;line-height:1.5}
.p-travel{background:var(--accent-soft);color:var(--accent)}
.p-local{background:var(--btn-soft);color:var(--navy)}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-mute{background:var(--sunken);color:var(--ink-2)}

/* ---------- next-up hero ---------- */
.nextup{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0;overflow:hidden}
.dateblock{background:var(--hdr);color:var(--hdr-ink);padding:16px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:112px;border-top:5px solid var(--accent)}
.dateblock .dow{font-family:var(--f-cond);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:14px;color:var(--hdr-mute)}
.dateblock .dnum{font-family:var(--f-display);font-weight:900;font-size:64px;line-height:.9}
.dateblock .mon{font-family:var(--f-cond);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:15px}
.nextup .body{padding:16px 18px;display:flex;flex-direction:column;gap:8px;min-width:0}
.nextup h3{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1;text-transform:uppercase}
.meta{display:flex;gap:6px 14px;flex-wrap:wrap;color:var(--ink-2);font-size:14px}
@media (max-width:480px){.nextup{grid-template-columns:minmax(0,1fr)}.dateblock{flex-direction:row;gap:10px;justify-content:flex-start;min-width:0;padding:10px 16px}.dateblock .dnum{font-size:40px}}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:560px){.stats{grid-template-columns:minmax(0,1fr)}}
.stat{padding:12px 14px}
.stat .v{font-family:var(--f-display);font-weight:800;font-size:32px;line-height:1;margin-top:4px}
.stat .s{font-size:13px;color:var(--ink-2);margin-top:4px}
.meter{height:6px;border-radius:99px;background:var(--sunken);overflow:hidden;margin-top:8px}
.meter>i{display:block;height:100%;background:var(--ok);border-radius:99px}

/* ---------- lists ---------- */
.list{list-style:none;margin:0;padding:0}
.li{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line-2)}
.li:first-child{border-top:0}
.todo{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line-2);cursor:pointer;text-align:left;width:100%}
.todo:hover{border-color:var(--line)}
.todo .dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--accent)}
.todo .dot.warn{background:var(--warn)}
.todo .dot.ok{background:var(--ok)}
.todo .t{flex:1;min-width:0}
.todo .t b{display:block;font-weight:600}
.todo .go{color:var(--ink-3);font-size:18px}
.ann{padding:12px 0;border-top:1px solid var(--line-2)}
.ann:first-child{border-top:0}
.ann .txt{white-space:pre-wrap;margin:4px 0 0}
.pin{color:var(--accent);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-family:var(--f-cond)}

/* schedule */
.month{font-family:var(--f-cond);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:15px;color:var(--ink-2);margin:22px 0 8px;display:flex;align-items:center;gap:10px}
.month::after{content:"";flex:1;height:1px;background:var(--line)}
.ev{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:6px}
.ev.k-tournament{border-left:5px solid var(--accent)}
.ev.k-practice{border-left:5px solid var(--btn)}
.ev.k-event{border-left:5px solid var(--warn)}
.ev.k-deadline{border-left:5px solid var(--ink-3)}
.ev.cancel{opacity:.6}
.ev.cancel .ev-t{text-decoration:line-through}
.ev .d{text-align:center;line-height:1}
.ev .d .dw{font-family:var(--f-cond);font-weight:600;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.ev .d .dn{font-family:var(--f-display);font-weight:800;font-size:28px}
.ev-t{font-weight:600;font-size:15.5px}
.ev-t button{all:unset;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.ev-t button:hover{text-decoration-color:var(--ink-3)}
.ev .side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
@media (max-width:640px){.ev{grid-template-columns:48px minmax(0,1fr)}.ev .side{grid-column:1/-1;align-items:flex-start;flex-direction:row;flex-wrap:wrap}}
.rsvp{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.rsvp button{appearance:none;border:0;background:var(--surface);padding:5px 10px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink-2);border-left:1px solid var(--line)}
.rsvp button:first-child{border-left:0}
.rsvp button[aria-pressed="true"].y{background:var(--ok);color:#fff}
.rsvp button[aria-pressed="true"].m{background:var(--warn);color:#fff}
.rsvp button[aria-pressed="true"].n{background:var(--bad);color:#fff}
.counts{font-size:12.5px;color:var(--ink-2)}

/* tournaments */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.tcard{appearance:none;text-align:left;cursor:pointer;padding:0;display:flex;flex-direction:column;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.tcard:hover{border-color:var(--ink-3)}
.tcard .top{display:flex;gap:12px;align-items:center;padding:14px 14px 10px}
.tcard .when{background:var(--hdr);color:var(--hdr-ink);border-radius:8px;padding:6px 8px;text-align:center;min-width:64px;line-height:1.05}
.tcard .when .m{font-family:var(--f-cond);font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:12px;color:var(--hdr-mute)}
.tcard .when .dd{font-family:var(--f-display);font-weight:800;font-size:22px}
.tcard.past{opacity:.62}
.tcard h3{font-weight:700;font-size:16px;line-height:1.2}
.tcard .foot{border-top:1px solid var(--line-2);padding:8px 14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--ink-2);margin-top:auto}
.thead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:end;padding:18px;background:var(--hdr);color:var(--hdr-ink);border-radius:var(--r) var(--r) 0 0;position:relative;overflow:hidden}
.thead::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--accent)}
.thead h2{font-family:var(--f-display);font-weight:900;font-size:36px;line-height:.95;text-transform:uppercase}
.thead .meta{color:var(--hdr-mute)}
.thead a{color:var(--hdr-ink)}
.thead .count{text-align:right}
.thead .count .v{font-family:var(--f-display);font-weight:900;font-size:44px;line-height:.9}
@media (max-width:560px){.thead{grid-template-columns:minmax(0,1fr)}.thead .count{text-align:left}}
.subtabs{display:flex;gap:4px;overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-top:0;padding:6px;border-radius:0 0 var(--r) var(--r);margin-bottom:16px}
.subtabs button{appearance:none;border:0;background:none;padding:8px 12px;border-radius:8px;font-weight:600;cursor:pointer;color:var(--ink-2);white-space:nowrap}
.subtabs button[aria-selected="true"]{background:var(--btn-soft);color:var(--ink)}
.kv{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr);border-top:1px solid var(--line-2)}
.kv>div{padding:10px 0;border-bottom:1px solid var(--line-2)}
.kv>div:nth-child(odd){color:var(--ink-3);font-family:var(--f-cond);font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:13px;padding-right:12px;padding-top:12px}
.kv>div:nth-child(even){white-space:pre-wrap;overflow-wrap:anywhere}
@media (max-width:520px){.kv{grid-template-columns:minmax(0,1fr)}.kv>div:nth-child(odd){border-bottom:0;padding-bottom:0}}
.tbd{color:var(--ink-3);font-style:italic}
.checklist{list-style:none;padding:0;margin:0;columns:2 220px;column-gap:18px}
.checklist li{break-inside:avoid;padding:5px 0 5px 26px;position:relative}
.checklist li::before{content:"";position:absolute;left:0;top:8px;width:15px;height:15px;border:2px solid var(--ink-3);border-radius:4px}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line-2);vertical-align:middle}
th{font-family:var(--f-cond);font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:12.5px;color:var(--ink-3);background:var(--surface-2);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.mine td{background:color-mix(in srgb,var(--accent) 7%,transparent)}
.sticky-col{position:sticky;left:0;background:var(--surface);z-index:1}
th.sticky-col{background:var(--surface-2)}
tr.mine td.sticky-col{background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
select.cell{font:inherit;font-size:13.5px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);min-width:88px}

/* roster */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.pcard{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;padding:14px}
.jersey{width:64px;height:70px;position:relative;display:flex;align-items:center;justify-content:center}
.jersey svg{position:absolute;inset:0;width:100%;height:100%}
.jersey b{position:relative;font-family:var(--f-display);font-weight:900;font-size:28px;color:#fff;margin-top:8px}
.pcard h3{font-size:17px;font-weight:700}
.parent{font-size:13.5px;padding-top:6px;margin-top:6px;border-top:1px dashed var(--line)}
.parent .pn{font-weight:600}
.copy{appearance:none;border:0;background:none;padding:0;color:var(--navy);cursor:pointer;font:inherit;font-size:13.5px;text-align:left;overflow-wrap:anywhere}
.copy:hover{text-decoration:underline}

/* fund */
.bignum{font-family:var(--f-display);font-weight:900;font-size:52px;line-height:.95}
.amt-in{color:var(--ok)}
.amt-out{color:var(--bad)}
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.calc label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-2)}
.calc input,.calc select{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.calc-out{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:12px}
.calc-out>div{background:var(--surface-2);border:1px solid var(--line-2);border-radius:10px;padding:10px 12px}
.calc-out .v{font-family:var(--f-display);font-weight:800;font-size:28px}

/* handbook */
.hb h3{font-family:var(--f-cond);font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:.04em}
.hb p{white-space:pre-wrap;margin:6px 0 0;max-width:72ch}
.hb section{padding:14px 0;border-top:1px solid var(--line-2)}
.hb section:first-child{border-top:0}
.task-s{appearance:none;border:0;cursor:pointer}

/* modal */

<script>
(() => {
"use strict";
/* ============ helpers ============ */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pd = s => { const [y, m, d] = String(s).split("-").map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const addDays = (s, n) => { const d = pd(s); d.setDate(d.getDate() + n); return iso(d); };
const TODAY = iso(new Date());
const NOW = () => new Date().toISOString();
const daysUntil = s => Math.round((pd(s) - pd(TODAY)) / 864e5);
const fmt = (s, o) => s ? pd(s).toLocaleDateString("en-US", o || { weekday: "short", month: "short", day: "numeric" }) : "";
const MON = s => fmt(s, { month: "short" });
function fmtRange(a, b) {
  if (!b || b === a) return fmt(a, { weekday: "short", month: "short", day: "numeric" });
  const A = pd(a), B = pd(b);
  if (A.getMonth() === B.getMonth()) return `${MON(a)} ${A.getDate()}–${B.getDate()}`;
  return `${MON(a)} ${A.getDate()} – ${MON(b)} ${B.getDate()}`;
}
const money = n => (n < 0 ? "−$" : "$") + Math.abs(Math.round(n * 100) / 100).toLocaleString("en-US", { minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 });
function tmin(t) { const m = /(\d{1,2}):(\d{2})\s*(AM|PM)?/i.exec(t || ""); if (!m) return 0; let h = +m[1] % 12; if ((m[3] || "").toUpperCase() === "PM") h += 12; return h * 60 + +m[2]; }
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const norm = s => String(s || "").trim().toLowerCase().replace(/\s+/g, " ");
const clone = o => JSON.parse(JSON.stringify(o || {}));

/* ============ roles & permissions ============ */
const ROLES = {
  admin: { label: "Team admin", desc: "Full access to this team's pages, people and settings." },
  coach: { label: "Coach", desc: "Runs the schedule, tournaments, ref jobs and announcements." },
  coordinator: { label: "Team coordinator", desc: "Point person for the coach. Manages everything except accounts." },
  food: { label: "Food coordinator", desc: "Plans team meals and assigns families." },
  finance: { label: "Finance", desc: "Keeps the ledger and confirms payments and reimbursements." },
  parent: { label: "Parent / guardian", desc: "Answers for their own family." }
};
const ROLE_ORDER = ["admin", "coach", "coordinator", "food", "finance", "parent"];
const PERMS = [
  ["contacts", "See roster phone numbers and emails", ["admin", "coach", "coordinator", "food", "finance", "parent"]],
  ["fundView", "See the team fund and dues", ["admin", "coach", "coordinator", "food", "finance", "parent"]],
  ["family", "Answer for own family: availability, travel, uniform sizes, meal sign-ups, payments", ["parent"]],
  ["reimb", "Request a reimbursement", ["admin", "coach", "coordinator", "food", "finance", "parent"]],
  ["attendance", "Mark availability for any player", ["admin", "coach", "coordinator"]],
  ["schedule", "Edit schedule, practices, tournaments, hotels and game-day sheets", ["admin", "coach", "coordinator"]],
  ["refjobs", "Assign ref jobs", ["admin", "coach", "coordinator"]],
  ["announce", "Post and pin announcements", ["admin", "coach", "coordinator"]],
  ["handbook", "Edit the team handbook", ["admin", "coach", "coordinator"]],
  ["meals", "Plan meals and assign families to them", ["admin", "coordinator", "food"]],
  ["finance", "Add, edit and confirm fund entries", ["admin", "coordinator", "finance"]],
  ["roster", "Edit the roster; fix any family's travel or sizes", ["admin", "coordinator"]],
  ["tasks", "Manage coordinator tasks", ["admin", "coordinator"]],
  ["settings", "Change team settings", ["admin", "coordinator"]]
];
const PERM_OF = Object.fromEntries(PERMS.map(([k, , r]) => [k, new Set(r)]));
const rolesHave = (roles, perm) => [...roles].some(r => PERM_OF[perm] && PERM_OF[perm].has(r));
const roleChip = r => `<span class="role r-${r}">${esc((ROLES[r] || { label: r }).label)}</span>`;

/* ============ state ============ */
const S = {
  players: [], events: [], meals: [], ledger: [], announcements: [], tasks: [],
  refjobs: {}, agenda: {}, meta: {}, teams: [], accounts: {}, mine: {},
  loaded: new Set(), dbState: "connecting"
};
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
const UI = { tab: "home", teamId: "", eventId: null, sub: "gameday", schedFilter: "all", schedRange: "8w", calc: null, profiles: {} };
const V = { ready: false, id: null, name: "", email: null, avatar: "", isOwner: false };
const ARR = ["players", "events", "meals", "ledger", "announcements", "tasks"];
const MAP = ["refjobs", "agenda", "meta"];
const GLOBAL = ["teams", "accounts", "mine"];
let db = null, userNs = null, teamUnsubs = [];

const set = () => S.meta.settings || {};
const team = (id = UI.teamId) => S.teams.find(t => t.id === id);
const coachNames = () => (set().coaches || []).map(c => c.name).join(" or ") || "a coach";
const players = () => [...S.players].sort((a, b) => (a.order ?? 99) - (b.order ?? 99) || a.first.localeCompare(b.first));
const player = id => S.players.find(p => p.id === id);
const pname = id => { const p = player(id); return p ? p.first : "—"; };
const event = id => S.events.find(e => e.id === id);
const tournaments = () => S.events.filter(e => e.type === "tournament").sort((a, b) => a.date.localeCompare(b.date));

/* ============ people & accounts ============ */
function people() {
  const out = [];
  (set().coaches || []).forEach((c, i) => out.push({ id: "coach:" + i, name: c.name, type: "coach", roles: ["coach"] }));
  players().forEach(p => (p.parents || []).forEach((par, i) => out.push({ id: `parent:${p.id}:${i}`, name: par.name, email: par.email, cell: par.cell, type: "parent", pid: p.id, roles: ["parent"] })));
  return out;
}
function personName(ref) {
  if (!ref) return "";
  if (ref.startsWith("other:")) return ref.slice(6);
  const p = people().find(x => x.id === ref);
  return p ? p.name : "Unknown person";
}
function personPid(ref) { const m = /^parent:([^:]+):/.exec(ref || ""); return m ? m[1] : ""; }
function suggestedRoles(ref) {
  const st = set(), name = personName(ref), r = new Set();
  if ((ref || "").startsWith("coach:")) r.add("coach");
  if ((ref || "").startsWith("parent:")) r.add("parent");
  const has = l => (l || []).some(n => norm(n) === norm(name));
  if (has(st.admins)) r.add("admin");
  if (has(st.coordinators)) r.add("coordinator");
  if (has(st.food)) r.add("food");
  if (has(st.finance)) r.add("finance");
  return [...r];
}
const acctOf = (u, tid = UI.teamId) => (((S.accounts[u] || {}).teams) || {})[tid] || null;
const mineOf = (u, tid = UI.teamId) => (((S.mine[u] || {}).teams) || {})[tid] || {};
const isClubAdmin = u => !!(S.accounts[u] && S.accounts[u].clubAdmin);
const linkedAccounts = () => Object.keys(S.accounts).map(u => [u, acctOf(u)]).filter(([, a]) => a && a.status === "active" && a.person);
const acctRoles = u => { const a = acctOf(u), r = new Set((a && a.status === "active" && a.roles) || []); if (isClubAdmin(u)) r.add("admin"); return r; };
const acctPid = u => { const a = acctOf(u); return (a && a.status === "active" && a.pid) || ""; };
/** may account `u` write family data of type `famPerm` for player `pid`? */
function mayFor(u, pid, staffPerm) {
  const roles = acctRoles(u);
  if (!roles.size) return false;
  if (acctPid(u) === pid && rolesHave(roles, "family")) return true;
  return !!staffPerm && rolesHave(roles, staffPerm);
}
function me() {
  if (!V.ready || !V.id) return null;
  const a = acctOf(V.id);
  const active = a && a.status === "active";
  const roles = new Set(active ? a.roles || [] : []);
  if (V.isOwner || isClubAdmin(V.id)) roles.add("admin");
  if (!roles.size) return { id: V.id, linked: false, pending: pendingRequests().some(([u]) => u === V.id), declined: a && a.status === "declined", roles, can: () => false, name: V.name || "You" };
  const person = active ? a.person : "";
  return { id: V.id, linked: !!active, person, name: person ? personName(person) : (V.name || "Owner"), pid: active ? a.pid || "" : "", roles, can: p => p === "accounts" ? V.isOwner : rolesHave(roles, p) };
}
const can = p => { const m = me(); return !!(m && m.can(p)); };
const roleLine = m => [...m.roles].sort((a, b) => ROLE_ORDER.indexOf(a) - ROLE_ORDER.indexOf(b)).map(r => ROLES[r] ? ROLES[r].label : r).join(" · ");
function holders(role) {
  const out = linkedAccounts().filter(([, a]) => (a.roles || []).includes(role)).map(([, a]) => personName(a.person));
  return [...new Set(out)];
}

/* ============ merged family data (only valid writers count) ============ */
function mineEntries() { return Object.keys(S.mine).map(u => [u, mineOf(u)]); }
function rsvpOf(pid, key) {
  let best = null;
  for (const [u, d] of mineEntries()) {
    const e = ((d.rsvp || {})[pid] || {})[key];
    if (e && mayFor(u, pid, "attendance") && (!best || e.at > best.at)) best = e;
  }
  return best && best.v ? best.v : "";
}
function rsvpBy(pid, key) {
  let best = null, who = "";
  for (const [u, d] of mineEntries()) { const e = ((d.rsvp || {})[pid] || {})[key]; if (e && mayFor(u, pid, "attendance") && (!best || e.at > best.at)) { best = e; who = u; } }
  return who ? personName((acctOf(who) || {}).person) || "a coach" : "";
}
function travelOf(pid, eid) {
  let best = null;
  for (const [u, d] of mineEntries()) { const e = ((d.travel || {})[pid] || {})[eid]; if (e && mayFor(u, pid, "roster") && (!best || e.at > best.at)) best = e; }
  return best && !best.cleared ? best : null;
}
function uniformOf(pid) {
  let best = null;
  for (const [u, d] of mineEntries()) { const e = (d.uniform || {})[pid]; if (e && mayFor(u, pid, "roster") && (!best || e.at > best.at)) best = e; }
  return (best && best.sizes) || {};
}
function mealClaim(x) {
  if (x.claimedBy) return { pid: x.claimedBy, staff: true };
  let best = null;
  for (const [u, d] of mineEntries()) {
    const c = (d.claims || {})[x.id];
    if (c && c.pid && mayFor(u, c.pid, null) && (!x.resetAt || c.at > x.resetAt) && (!best || c.at < best.at)) best = { ...c, u };
  }
  return best;
}
function allPayments() {
  const out = [], srcs = new Set(S.ledger.map(l => l.src).filter(Boolean));
  for (const [u, d] of mineEntries()) {
    const roles = acctRoles(u); if (!roles.size) continue;
    for (const [id, p] of Object.entries(d.payments || {})) {
      if (p.kind === "in" && !mayFor(u, p.pid, null)) continue;
      if (p.kind === "out" && !rolesHave(roles, "reimb")) continue;
      const src = u + ":" + id;
      out.push({ ...p, id, u, src, done: srcs.has(src), who: personName((acctOf(u) || {}).person) });
    }
  }
  return out;
}
const pendingPayments = () => allPayments().filter(p => !p.done);

/* ============ schedule model ============ */
function allItems() {
  const out = [], tours = tournaments(), st = set();
  for (const e of S.events) out.push({ key: e.id, kind: e.type === "tournament" ? "tournament" : (e.type || "event"), title: e.title, date: e.date, end: e.endDate || e.date, time: e.time || "", location: e.location || e.city || "", src: e, travel: !!e.travel });
  for (const r of st.practices || []) {
    if (!r.from) continue;
    const d = pd(r.from), until = pd(r.until || "2027-06-30");
    let guard = 0;
    while (d.getDay() !== Number(r.dow) && guard++ < 8) d.setDate(d.getDate() + 1);
    for (; d <= until; d.setDate(d.getDate() + 7)) {
      const ds = iso(d);
      if (tours.some(t => ds >= t.date && ds <= (t.endDate || t.date))) continue;
      const key = "pr-" + r.id + "-" + ds;
      out.push({ key, kind: "practice", title: r.label, date: ds, end: ds, time: r.start ? r.start + (r.end ? " – " + r.end : "") : "Time TBD", location: r.location || "", rule: r, note: r.note || "", cancelled: (st.cancelled || []).includes(key) });
    }
  }
  out.sort((a, b) => a.date.localeCompare(b.date) || tmin(a.time) - tmin(b.time));
  return out;
}
const rsvpable = it => it.kind !== "deadline";
function counts(key) {
  const c = { yes: 0, maybe: 0, no: 0, none: 0 };
  S.players.forEach(p => { c[rsvpOf(p.id, key) || "none"]++; });
  return c;
}

/* ============ db + identity ============ */
async function connect() {
  const c = window.claude;
  const has = c && typeof c.use === "function";
  try { userNs = has ? await c.use("user") : null; } catch (e) { userNs = null; }
  if (userNs) {
    try { const v = await userNs.me(); Object.assign(V, { id: v.id, name: v.name || "", email: v.email, avatar: v.avatarUrl, isOwner: !!v.isOwner }); } catch (e) {}
  }
  V.ready = true;
  try { db = has ? await c.use("db") : null; } catch (e) { db = null; }
  if (!db) { S.dbState = "off"; render(); return; }
  S.dbState = "on";
  GLOBAL.forEach(col => {
    db.collection(col).onSnapshot(snap => {
      if (col === "teams") S.teams = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => String(a.name).localeCompare(String(b.name)));
      else { const o = {}; snap.docs.forEach(d => o[d.id] = d.data()); S[col] = o; }
      S.loaded.add(col);
      if (col === "accounts" || col === "mine") resolveProfiles();
      if (!UI.teamId && S.loaded.has("teams") && S.loaded.has("accounts")) pickTeam();
      scheduleRender();
    }, err => { if (err && err.code === "revoked") { S.dbState = "off"; scheduleRender(); } });
  });
}
function pickTeam() {
  const live = id => S.teams.some(t => t.id === id && !t.archived);
  const cand = [store.get("hub-team"), ...Object.keys((S.accounts[V.id] || {}).teams || {})].find(live);
  if (cand) setTeam(cand, true);
  else if (S.teams.filter(t => !t.archived).length === 1) setTeam(S.teams.find(t => !t.archived).id, true);
  else UI.tab = "club";
}
function setTeam(id, quiet) {
  teamUnsubs.forEach(f => { try { f(); } catch (e) {} }); teamUnsubs = [];
  UI.teamId = id; UI.eventId = null; UI.calc = null; UI.tab = quiet && UI.tab === "club" ? "home" : "home";
  store.set("hub-team", id);
  ARR.forEach(c => S[c] = []); MAP.forEach(c => S[c] = {});
  [...ARR, ...MAP].forEach(c => S.loaded.delete(c));
  if (!db) return;
  [...ARR, ...MAP].forEach(col => {
    teamUnsubs.push(db.collection(`teams/${id}/${col}`).onSnapshot(snap => {
      if (UI.teamId !== id) return;
      if (ARR.includes(col)) S[col] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      else { const o = {}; snap.docs.forEach(d => o[d.id] = d.data()); S[col] = o; }
      S.loaded.add(col);
      scheduleRender();
    }, err => { if (err && err.code === "revoked") { S.dbState = "off"; scheduleRender(); } }));
  });
  if (!quiet) { render(); window.scrollTo(0, 0); }
}
async function resolveProfiles() {
  if (!userNs) return;
  const ids = [...new Set([...Object.keys(S.accounts), ...Object.keys(S.mine)])];
  if (!ids.length) return;
  try { UI.profiles = await userNs.profiles(ids); scheduleRender(); } catch (e) {}
}
const prof = u => UI.profiles[u] || { name: "", email: null, avatarUrl: "" };
const scoped = path => /^(accounts|mine|teams)\//.test(path) ? path : `teams/${UI.teamId}/${path}`;
function saveAcct(u, entry, msg, top) {
  const d = clone(S.accounts[u]); d.teams = d.teams || {}; d.teams[UI.teamId] = entry; Object.assign(d, top || {});
  return save("accounts/" + u, d, msg);
}
async function save(path, data, msg) {
  if (!db) { toast("Saving isn't available in this view."); return false; }
  path = scoped(path);
  try { await db.doc(path).set(JSON.parse(JSON.stringify(data))); if (msg) toast(msg); return true; }
  catch (e) {
    if (e && e.code === "invalid_argument") toast("You don't have access to change that. Ask the site admin.");
    else if (e && e.code === "quota_exceeded") toast("The team database is full. Delete old entries and try again.");
    else toast("That didn't save. Check your connection and try again.");
    return false;
  }
}
async function remove(path, msg) {
  if (!db) return false;
  path = scoped(path);
  try { await db.doc(path).delete(); if (msg) toast(msg); return true; } catch (e) { toast("That didn't delete. Try again."); return false; }
}
let mineQ = Promise.resolve(true);
function writeMine(mut, msg) {
  if (!V.id) { toast("Sign in to claude.ai to save."); return Promise.resolve(false); }
  const tid = UI.teamId;
  mineQ = mineQ.then(async () => {
    const cur = clone(S.mine[V.id]); cur.teams = cur.teams || {}; cur.teams[tid] = cur.teams[tid] || {};
    mut(cur.teams[tid]); cur.updated = NOW();
    S.mine[V.id] = cur; scheduleRender();

function duesFor(pid) {
  let paid = 0, pending = 0;
  S.ledger.forEach(l => { if (l.pid === pid && l.cat === "Dues" && l.kind === "in" && l.status !== "declined") paid += +l.amount || 0; });
  pendingPayments().forEach(p => { if (p.kind === "in" && p.pid === pid && p.cat === "Dues") pending += +p.amount || 0; });
  return { paid, pending };
}
function fundStats() {
  let inn = 0, out = 0, pendingIn = 0, pendingOut = 0;
  S.ledger.forEach(l => { if (l.status === "declined") return; const a = +l.amount || 0; if (l.kind === "in") inn += a; else out += a; });
  pendingPayments().forEach(p => { if (p.kind === "in") pendingIn += +p.amount || 0; else pendingOut += +p.amount || 0; });
  const amt = (set().dues || {}).amount || 0;
  const duesPaidFamilies = S.players.filter(p => amt > 0 && duesFor(p.id).paid >= amt).length;
  return { inn, out, balance: inn - out, pendingIn, pendingOut, duesPaidFamilies };
}

function closeModal() { const md = $("#modal"); md.hidden = true; md.innerHTML = ""; }
function fieldHtml(f) {
  const id = "f_" + f.id, v = f.value ?? "";
  const hint = f.hint ? `<span class="hint">${esc(f.hint)}</span>` : "";
  if (f.type === "textarea") return `<label for="${id}">${esc(f.label)}${hint}<textarea id="${id}" name="${f.id}" rows="${f.rows || 4}">${esc(v)}</textarea></label>`;
  if (f.type === "select") return `<label for="${id}">${esc(f.label)}${hint}<select id="${id}" name="${f.id}">${f.options.map(o => { const ov = typeof o === "object" ? o.v : o, ol = typeof o === "object" ? o.l : o; return `<option value="${esc(ov)}" ${String(ov) === String(v) ? "selected" : ""}>${esc(ol)}</option>`; }).join("")}</select></label>`;
  if (f.type === "checks") return `<fieldset style="border:0;padding:0;margin:0"><legend class="label" style="margin-bottom:6px">${esc(f.label)}</legend><div class="checks">${f.options.map(o => `<label><input type="checkbox" name="${f.id}" value="${esc(o.v)}" ${(v || []).includes(o.v) ? "checked" : ""}> ${esc(o.l)}</label>`).join("")}</div>${hint}</fieldset>`;
  if (f.type === "two") return `<div class="two">${f.fields.map(fieldHtml).join("")}</div>`;
  if (f.type === "note") return `<p class="small muted" style="margin:0">${esc(f.text)}</p>`;
  return `<label for="${id}">${esc(f.label)}${hint}<input id="${id}" name="${f.id}" type="${f.type || "text"}" value="${esc(v)}" ${f.type === "number" ? 'step="any"' : ""} ${f.placeholder ? `placeholder="${esc(f.placeholder)}"` : ""}></label>`;
}
function openForm({ title, intro, fields, submit = "Save", onSubmit, onDelete, deleteLabel = "Delete" }) {
  const md = $("#modal");
  md.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mt"><div class="sheet-h"><h3 id="mt">${esc(title)}</h3><button class="icon-btn" type="button" data-act="closeModal" aria-label="Close">×</button></div>
    ${intro ? `<p class="muted small" style="margin:0 18px 4px">${esc(intro)}</p>` : ""}
    <form id="mf" class="form" novalidate>${fields.map(fieldHtml).join("")}<div class="form-actions">${onDelete ? `<button type="button" class="btn danger-ghost" id="mdel">${esc(deleteLabel)}</button>` : ""}<span class="spacer"></span><button type="button" class="btn ghost" data-act="closeModal">Cancel</button><button class="btn primary" type="submit">${esc(submit)}</button></div></form></div>`;
  md.hidden = false;
  const first = md.querySelector("input:not([type=checkbox]),textarea,select"); if (first) setTimeout(() => first.focus(), 30);
  $("#mf").addEventListener("submit", async ev => {
    ev.preventDefault();
    const fd = new FormData(ev.target), vals = {};
    const multi = new Set(fields.flatMap(f => f.type === "checks" ? [f.id] : []));
    for (const [k, v] of fd.entries()) { if (multi.has(k)) (vals[k] = vals[k] || []).push(v); else vals[k] = typeof v === "string" ? v.trim() : v; }
    multi.forEach(k => { if (!vals[k]) vals[k] = []; });
    const btn = ev.target.querySelector('button[type="submit"]'); btn.disabled = true;
    const ok = await onSubmit(vals);
    if (ok !== false) closeModal(); else btn.disabled = false;
  });
  if (onDelete) {
    const d = $("#mdel");
    d.addEventListener("click", async () => {
      if (!d.classList.contains("confirming")) { d.classList.add("confirming"); d.textContent = "Tap again to confirm"; return; }
      d.disabled = true; await onDelete(); closeModal();
    });
  }
}
