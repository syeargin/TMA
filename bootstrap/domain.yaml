AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Team Hub (TMA) domain: the Route 53 DNS zone for the site's domain, the Amazon SES identity that
  sign-in and team emails are sent from (R10), the SES configuration set team email goes through
  (Messaging M1), and the TLS certificate for the site and API addresses.
  Deployed by hand once (stack name tma-domain), like the bootstrap stack; both environments use it.
  Step 1: deploy with CreateCertificate=false, then point the domain's nameservers at the
  NameServers output (at the registrar). Step 2, once DNS answers from Route 53: update the stack
  with CreateCertificate=true. See README, "Domain and email".

Parameters:
  DomainName:
    Type: String
    Default: teemhub.net
    AllowedPattern: "^[a-z0-9-]+(\\.[a-z0-9-]+)+$"
  CreateCertificate:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
    Description: >
      Set to true only after the registrar uses this zone's nameservers: the certificate is checked
      through DNS, and the stack waits until that check passes.
  ExistingHostedZoneId:
    Type: String
    Default: ""
    Description: >
      Leave empty to create the zone. If Route 53 already has a hosted zone for the domain, enter its
      id (like Z0123456789ABC) and the stack uses that zone instead of making a second one.
  DmarcReportEmail:
    Type: String
    Default: ""
    Description: Optional. An address that receives daily DMARC reports (who sent mail as this domain).
  GoogleSiteVerification:
    Type: String
    Default: ""
    AllowedPattern: "^(google-site-verification=[A-Za-z0-9_-]+)?$"
    Description: >
      Optional. Google Workspace's domain verification value, like google-site-verification=abc123
      (Admin console → Domains). When set, mail to @teemhub.net goes to Google Workspace, and Google
      may send as the domain alongside SES.

Conditions:
  WantCertificate: !Equals [!Ref CreateCertificate, "true"]
  CreateZone: !Equals [!Ref ExistingHostedZoneId, ""]
  HasDmarcReports: !Not [!Equals [!Ref DmarcReportEmail, ""]]
  UseGoogleMail: !Not [!Equals [!Ref GoogleSiteVerification, ""]]

Resources:
  Zone:
    Type: AWS::Route53::HostedZone
    Condition: CreateZone
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Ref DomainName
      HostedZoneConfig: { Comment: Team Hub (managed by the tma-domain stack and the app stacks) }
      HostedZoneTags:
        - { Key: app, Value: team-hub }

  # ---------- Email (R10): sign-in codes come from noreply@<domain> through SES ----------
  EmailIdentity:
    Type: AWS::SES::EmailIdentity
    Properties:
      EmailIdentity: !Ref DomainName
      DkimSigningAttributes: { NextSigningKeyLength: RSA_2048_BIT }
      # Bounces come back to mail.<domain> (SES) so SPF lines up with the From domain.
      MailFromAttributes:
        MailFromDomain: !Sub "mail.${DomainName}"
        BehaviorOnMxFailure: USE_DEFAULT_VALUE
      # noreply@ has no mailbox; SES's account-level suppression list handles bounces and complaints.
      FeedbackAttributes: { EmailForwardingEnabled: false }

  EmailRecords:
    Type: AWS::Route53::RecordSetGroup
    Properties:
      HostedZoneId: !If [CreateZone, !Ref Zone, !Ref ExistingHostedZoneId]
      RecordSets:
        # Easy DKIM: SES signs every message; these prove the signatures are ours.
        - { Name: !GetAtt EmailIdentity.DkimDNSTokenName1, Type: CNAME, TTL: "1800", ResourceRecords: [!GetAtt EmailIdentity.DkimDNSTokenValue1] }
        - { Name: !GetAtt EmailIdentity.DkimDNSTokenName2, Type: CNAME, TTL: "1800", ResourceRecords: [!GetAtt EmailIdentity.DkimDNSTokenValue2] }
        - { Name: !GetAtt EmailIdentity.DkimDNSTokenName3, Type: CNAME, TTL: "1800", ResourceRecords: [!GetAtt EmailIdentity.DkimDNSTokenValue3] }
        # Custom MAIL FROM (bounce) domain.
        - { Name: !Sub "mail.${DomainName}", Type: MX, TTL: "1800", ResourceRecords: [!Sub "10 feedback-smtp.${AWS::Region}.amazonses.com"] }
        - { Name: !Sub "mail.${DomainName}", Type: TXT, TTL: "1800", ResourceRecords: ['"v=spf1 include:amazonses.com ~all"'] }
        # Who may send as this domain: SES, plus Google Workspace when it's set up. One TXT record holds
        # both the sender rule and Google's verification value (Route 53 allows one TXT set per name).
        - Name: !Ref DomainName
          Type: TXT
          TTL: "1800"
          ResourceRecords: !If
            - UseGoogleMail
            - ['"v=spf1 include:_spf.google.com include:amazonses.com -all"', !Sub '"${GoogleSiteVerification}"']
            - ['"v=spf1 include:amazonses.com -all"']
        # Mailboxes like support@ are in Google Workspace. SES's bounce domain (mail.) keeps its own MX.
        - !If
          - UseGoogleMail
          - { Name: !Ref DomainName, Type: MX, TTL: "3600", ResourceRecords: ["1 smtp.google.com"] }
          - !Ref AWS::NoValue
        - Name: !Sub "_dmarc.${DomainName}"
          Type: TXT
          TTL: "1800"
          ResourceRecords:
            - !If
              - HasDmarcReports
              - !Sub '"v=DMARC1; p=quarantine; adkim=r; aspf=r; rua=mailto:${DmarcReportEmail}"'
              - '"v=DMARC1; p=quarantine; adkim=r; aspf=r"'

  # Team email (Messaging M1): the app stacks send through this configuration set and tag each message
  # with its environment; delivered, bounced, complaint and reject events go to EventBridge, where
  # each app stack's rule picks up its own. Sign-in codes from Cognito don't use it.
  MailConfigSet:
    Type: AWS::SES::ConfigurationSet
    Properties:
      Name: !Sub "${AWS::StackName}-mail"
      ReputationOptions: { ReputationMetricsEnabled: true }
      SendingOptions: { SendingEnabled: true }
      # Addresses that bounced or complained aren't sent to again (SES's account-level list).
      SuppressionOptions: { SuppressedReasons: [BOUNCE, COMPLAINT] }

  MailEventDestination:
    Type: AWS::SES::ConfigurationSetEventDestination
    Properties:
      ConfigurationSetName: !Ref MailConfigSet
      EventDestination:
        Name: eventbridge
        Enabled: true
        # OPEN adds SES's tracking image to HTML emails, for the Delivery health tab's open counts (Messaging M3).
        MatchingEventTypes: [DELIVERY, BOUNCE, COMPLAINT, REJECT, OPEN]
        EventBridgeDestination:
          EventBusArn: !Sub "arn:aws:events:${AWS::Region}:${AWS::AccountId}:event-bus/default"

  # SES's own reputation numbers for everything sent through the configuration set (dev and prod).
  # SES starts reviewing an account at 5% bounces or 0.1% complaints; these warn well before.
  MailBounceRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-mail-bounce-rate"
      AlarmDescription: Over 2% of team email is bouncing. Check each team's Delivery health tab for bad addresses.
      Namespace: AWS/SES
      MetricName: Reputation.BounceRate
      Dimensions: [{ Name: "ses:configuration-set", Value: !Ref MailConfigSet }]
      Statistic: Maximum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 0.02
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  MailComplaintRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-mail-complaint-rate"
      AlarmDescription: People are marking team email as spam (over 0.05%). Check which message on the Delivery health tabs.
      Namespace: AWS/SES
      MetricName: Reputation.ComplaintRate
      Dimensions: [{ Name: "ses:configuration-set", Value: !Ref MailConfigSet }]
      Statistic: Maximum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 0.0005
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  # ---------- TLS: one certificate for <domain> and *.<domain> (dev., api., api-dev., ws., ws-dev.) ----------
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Condition: WantCertificate
    Properties:
      DomainName: !Ref DomainName
      SubjectAlternativeNames: [!Sub "*.${DomainName}"]
      ValidationMethod: DNS
      # The domain and its wildcard share one validation record, which CloudFormation adds to the zone.
      DomainValidationOptions:
        - { DomainName: !Ref DomainName, HostedZoneId: !If [CreateZone, !Ref Zone, !Ref ExistingHostedZoneId] }
      Tags:
        - { Key: app, Value: team-hub }

Outputs:
  NameServers:
    Condition: CreateZone
    Description: Enter these four at the registrar (GoDaddy → teemhub.net → DNS → Nameservers → Change → "I'll use my own nameservers").
    Value: !Join [", ", !GetAtt Zone.NameServers]
  HostedZoneId:
    Value: !If [CreateZone, !Ref Zone, !Ref ExistingHostedZoneId]
    Export: { Name: !Sub "${AWS::StackName}-HostedZoneId" }
  DomainName:
    Value: !Ref DomainName
    Export: { Name: !Sub "${AWS::StackName}-DomainName" }
  MailConfigSet:
    Description: The SES configuration set the app stacks send team email through.
    Value: !Ref MailConfigSet
    Export: { Name: !Sub "${AWS::StackName}-MailConfigSet" }
  CertificateArn:
    Condition: WantCertificate
    Value: !Ref Certificate
    Export: { Name: !Sub "${AWS::StackName}-CertificateArn" }
