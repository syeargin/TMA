AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Team Hub (TMA) bootstrap, deployed by hand once per AWS account. Lets GitHub Actions in
  syeargin/TMA deploy without stored keys (OIDC) and creates the SAM artifact bucket. Each
  environment gets its own GitHub deploy role, its own CloudFormation execution role limited to
  that environment's resources, and a permissions boundary that every role the app stack creates
  must carry. To move prod to its own account, deploy this there with Environments=prod and
  redeploy it here with Environments=dev.

Parameters:
  GitHubOwner:
    Type: String
    Default: syeargin
  GitHubRepo:
    Type: String
    Default: TMA
  GitHubOwnerId:
    Type: String
    Default: "33122537"
    Description: Numeric GitHub account id of the owner (api.github.com/users/<owner> → id).
  GitHubRepoId:
    Type: String
    Default: "1389120123"
    Description: Numeric GitHub repository id (api.github.com/repos/<owner>/<repo> → id).
  CreateOidcProvider:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: Set to false if this account already has the token.actions.githubusercontent.com provider.
  AppPrefix:
    Type: String
    Default: tma
    AllowedPattern: "^[a-z][a-z0-9-]{1,15}$"
    Description: Prefix for stack names (tma-dev, tma-prod) and the app's resources.
  Environments:
    Type: String
    AllowedValues: ["dev,prod", "dev", "prod"]
    Default: "dev,prod"
    Description: Environments that deploy into this account. Use "prod" in a separate prod account and "dev" here once prod has moved.
  KeepSharedExecRole:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: >
      Keeps the old shared execution role (<prefix>-cfn-exec, PowerUserAccess) while stacks switch
      to their own roles. Set to false after dev and prod have each deployed once with the new roles.

Conditions:
  MakeProvider: !Equals [!Ref CreateOidcProvider, "true"]
  HasDev: !Not [!Equals [!Ref Environments, "prod"]]
  HasProd: !Not [!Equals [!Ref Environments, "dev"]]
  KeepShared: !Equals [!Ref KeepSharedExecRole, "true"]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${AppPrefix}-sam-artifacts-${AWS::AccountId}-${AWS::Region}"
      OwnershipControls: { Rules: [{ ObjectOwnership: BucketOwnerEnforced }] }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-artifacts
            Status: Enabled
            ExpirationInDays: 90
            NoncurrentVersionExpiration: { NoncurrentDays: 30 }

  ArtifactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt ArtifactBucket.Arn, !Sub "${ArtifactBucket.Arn}/*"]
            Condition: { Bool: { "aws:SecureTransport": "false" } }

  # The old execution role both environments shared. Kept only until each stack has deployed
  # once with its own role (KeepSharedExecRole=false removes it).
  CfnExecutionRole:
    Type: AWS::IAM::Role
    Condition: KeepShared
    Properties:
      RoleName: !Sub "${AppPrefix}-cfn-exec"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: cloudformation.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/PowerUserAccess
      Policies:
        - PolicyName: app-iam-roles-only
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ManageAppRoles
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:UpdateRole
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:PassRole
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:UpdateAssumeRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:PutRolePermissionsBoundary
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/${AppPrefix}-*"
              - Sid: ServiceLinkedRoles
                Effect: Allow
                Action: iam:CreateServiceLinkedRole
                Resource: "*"

  # GitHub issues OIDC subjects either as repo:<owner>/<repo>:environment:<env> or, with
  # immutable identifiers, repo:<owner>@<ownerId>/<repo>@<repoId>:environment:<env>.
  # Each deploy role accepts both, pinned to this repository and its own GitHub environment.
  # Which branches and tags may use an environment is set on the environment in GitHub
  # (dev: main only; prod: release tags), and the deploy workflow checks it again.

  # ================= dev =================

  # Ceiling for every role the dev app stack creates (the Lambda roles): this environment's
  # table and its stream, its own log groups, tracing, and posting to WebSocket connections.
  # Whatever policies a role is given, it can never do more than this.
  DevBoundary:
    Type: AWS::IAM::ManagedPolicy
    Condition: HasDev
    Properties:
      ManagedPolicyName: !Sub "${AppPrefix}-dev-boundary"
      Description: Permissions boundary for roles created by the dev app stack.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ThisEnvironmentsTable
            Effect: Allow
            Action: "dynamodb:*"
            Resource:
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/TeamHub-dev"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/TeamHub-dev/*"
          - Sid: ListStreams
            Effect: Allow
            Action: dynamodb:ListStreams
            Resource: "*"
          - Sid: OwnLogs
            Effect: Allow
            Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
            Resource:
              - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AppPrefix}-dev-*"
              - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AppPrefix}-dev-*:*"
          - Sid: Tracing
            Effect: Allow
            Action: [xray:PutTraceSegments, xray:PutTelemetryRecords, xray:GetSamplingRules, xray:GetSamplingTargets, xray:GetSamplingStatisticSummaries]
            Resource: "*"
          # The API checks whether someone has two-step sign-in on and resets it for a lost phone.
          # Each role's own policy names its environment's user pool.
          - Sid: TwoStepSignIn
            Effect: Allow
            Action: [cognito-idp:AdminGetUser, cognito-idp:AdminSetUserMFAPreference]
            Resource: !Sub "arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*"
          - Sid: LiveUpdates
            Effect: Allow
            Action: execute-api:ManageConnections
            Resource: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:*/live/POST/@connections/*"

  # The role CloudFormation uses for the dev stack. Resources with predictable names are limited
  # to dev's names. Cognito, API Gateway and CloudFront ids are random, so those rights can't be
  # scoped by name; anything tagged for another environment is refused instead. A separate prod
  # account is what fully isolates them.
  DevExecRole:
    Type: AWS::IAM::Role
    Condition: HasDev
    Properties:
      RoleName: !Sub "${AppPrefix}-cfn-exec-dev"
      Description: CloudFormation execution role for the dev app stack only.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: cloudformation.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: dev-stack-only
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # With a service role, CloudFormation expands the SAM transform as this role.
              - Sid: SamTransform
                Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource: !Sub "arn:aws:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31"
              - Sid: Table
                Effect: Allow
                Action: "dynamodb:*"
                Resource:
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/TeamHub-dev"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/TeamHub-dev/*"
              - Sid: TableReads
                Effect: Allow
                Action: [dynamodb:ListStreams, dynamodb:DescribeLimits, dynamodb:ListTables]
                Resource: "*"
              - Sid: TableKey
                Effect: Allow
                Action: [kms:DescribeKey, kms:CreateGrant]
                Resource: "*"
                Condition: { StringEquals: { "kms:ViaService": !Sub "dynamodb.${AWS::Region}.amazonaws.com" } }
              - Sid: SiteBucket
                Effect: Allow
                Action: "s3:*"
                Resource:
                  - !Sub "arn:aws:s3:::${AppPrefix}-dev-site-*"
                  - !Sub "arn:aws:s3:::${AppPrefix}-dev-site-*/*"
              - Sid: FunctionCode
                Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion]
                Resource: !Sub "${ArtifactBucket.Arn}/${AppPrefix}-dev/*"
              - Sid: Functions
                Effect: Allow
                Action: "lambda:*"
                Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AppPrefix}-dev-*"
              - Sid: StreamTriggers
                Effect: Allow
                Action: [lambda:CreateEventSourceMapping, lambda:UpdateEventSourceMapping, lambda:DeleteEventSourceMapping]
                Resource: "*"
                Condition: { ArnLike: { "lambda:FunctionArn": !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AppPrefix}-dev-*" } }
              - Sid: StreamTriggerReads
                Effect: Allow
                Action: [lambda:GetEventSourceMapping, lambda:ListEventSourceMappings, lambda:ListTags, lambda:TagResource, lambda:UntagResource]
                Resource: "*"
              - Sid: AppRolesNeedTheBoundary
                Effect: Allow
                Action: [iam:CreateRole, iam:PutRolePermissionsBoundary]
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/${AppPrefix}-dev-*"
                Condition: { StringEquals: { "iam:PermissionsBoundary": !Ref DevBoundary } }
              # "IfExists" lets the first deploy update roles made before boundaries existed, in
              # whatever order CloudFormation applies the changes. New roles can't skip the boundary
              # (above) and it can't be removed (KeepTheBoundary), so after that deploy every role has it.
              - Sid: AppRolePolicies
                Effect: Allow
                Action: [iam:AttachRolePolicy, iam:DetachRolePolicy, iam:PutRolePolicy, iam:DeleteRolePolicy]
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/${AppPrefix}-dev-*"
                Condition: { StringEqualsIfExists: { "iam:PermissionsBoundary": !Ref DevBoundary } }
              - Sid: AppRoles
                Effect: Allow
                Action:
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:DeleteRole
                  - iam:UpdateRole
                  - iam:UpdateRoleDescription
                  - iam:UpdateAssumeRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:ListRoleTags
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/${AppPrefix}-dev-*"
              - Sid: PassAppRolesToLambda
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/${AppPrefix}-dev-*"
                Condition: { StringEquals: { "iam:PassedToService": lambda.amazonaws.com } }
              - Sid: ServiceLinkedRoles
                Effect: Allow
                Action: iam:CreateServiceLinkedRole
                Resource: "*"
                Condition: { StringEquals: { "iam:AWSServiceName": [ops.apigateway.amazonaws.com, replication.dynamodb.amazonaws.com] } }
              - Sid: LogGroups
                Effect: Allow
                Action: "logs:*"
                Resource:
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AppPrefix}-dev-*"
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AppPrefix}-dev-*:*"
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/apigateway/${AppPrefix}-dev-*"
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/apigateway/${AppPrefix}-dev-*:*"
              - Sid: ApiAccessLogDelivery
                Effect: Allow
                Action:
                  - logs:DescribeLogGroups
                  - logs:CreateLogDelivery
                  - logs:GetLogDelivery
                  - logs:UpdateLogDelivery
                  - logs:DeleteLogDelivery
                  - logs:ListLogDeliveries
                  - logs:PutResourcePolicy
                  - logs:DescribeResourcePolicies
                Resource: "*"
              - Sid: Alarms
                Effect: Allow
                Action: [cloudwatch:PutMetricAlarm, cloudwatch:DeleteAlarms, cloudwatch:TagResource, cloudwatch:UntagResource, cloudwatch:ListTagsForResource]
                Resource: !Sub "arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${AppPrefix}-dev-*"
              - Sid: AlarmReads
                Effect: Allow
                Action: cloudwatch:DescribeAlarms
                Resource: "*"
              - Sid: Budget
                Effect: Allow
                Action: [budgets:ModifyBudget, budgets:ViewBudget, budgets:ListTagsForResource, budgets:TagResource, budgets:UntagResource]
                Resource: !Sub "arn:aws:budgets::${AWS::AccountId}:budget/${AppPrefix}-dev-*"
              - Sid: SignIn
                Effect: Allow
                Action: "cognito-idp:*"
                Resource: "*"
              - Sid: Apis
                Effect: Allow
                Action: "apigateway:*"
                Resource:
                  - !Sub "arn:aws:apigateway:${AWS::Region}::/apis"
                  - !Sub "arn:aws:apigateway:${AWS::Region}::/apis/*"
                  - !Sub "arn:aws:apigateway:${AWS::Region}::/tags/*"
              - Sid: Cdn
                Effect: Allow
                Action:
                  - cloudfront:CreateDistribution
                  - cloudfront:UpdateDistribution
                  - cloudfront:DeleteDistribution
                  - cloudfront:CreateOriginAccessControl
                  - cloudfront:UpdateOriginAccessControl
                  - cloudfront:DeleteOriginAccessControl
                  - cloudfront:TagResource
                  - cloudfront:UntagResource
                  - "cloudfront:Get*"
                  - "cloudfront:List*"
                Resource: "*"
              # Cognito, API Gateway and CloudFront are allowed by service above. Refuse anything
              # tagged (or being tagged) for a different environment.
              - Sid: NotOtherEnvironments
                Effect: Deny
                Action: ["cognito-idp:*", "apigateway:*", "cloudfront:*", "lambda:*"]
                Resource: "*"
                Condition:
                  "Null": { "aws:ResourceTag/env": "false" }
                  StringNotEquals: { "aws:ResourceTag/env": dev }
              - Sid: NoRetaggingToOtherEnvironments
                Effect: Deny
                Action: ["cognito-idp:*", "apigateway:*", "cloudfront:*", "lambda:*"]
                Resource: "*"
                Condition:
                  "Null": { "aws:RequestTag/env": "false" }
                  StringNotEquals: { "aws:RequestTag/env": dev }
              - Sid: KeepTheBoundary
                Effect: Deny
                Action: [iam:DeleteRolePermissionsBoundary, iam:CreatePolicyVersion, iam:SetDefaultPolicyVersion, iam:DeletePolicy]
                Resource: "*"

  DevDeployRole:
    Type: AWS::IAM::Role
    Condition: HasDev
    Properties:
      RoleName: !Sub "${AppPrefix}-github-deploy-dev"
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - MakeProvider
                - !Ref GitHubOidcProvider
                - !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                "token.actions.githubusercontent.com:aud": sts.amazonaws.com
                "token.actions.githubusercontent.com:sub":
                  - !Sub "repo:${GitHubOwner}@${GitHubOwnerId}/${GitHubRepo}@${GitHubRepoId}:environment:dev"
                  - !Sub "repo:${GitHubOwner}/${GitHubRepo}:environment:dev"
      Policies:
        - PolicyName: deploy-dev
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Stack
                Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:CreateChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - "cloudformation:Describe*"
                  - "cloudformation:GetTemplate*"
                  - cloudformation:ListStackResources
                Resource: !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AppPrefix}-dev/*"
              - Sid: SamTransform
                Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource: !Sub "arn:aws:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31"
              - Sid: ValidateTemplates
                Effect: Allow
                Action: [cloudformation:ValidateTemplate, cloudformation:ListStacks, cloudformation:GetTemplateSummary]
                Resource: "*"
              - Sid: PassOnlyThisEnvironmentsExecRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !If
                  - KeepShared
                  - [!GetAtt DevExecRole.Arn, !GetAtt CfnExecutionRole.Arn]
                  - !GetAtt DevExecRole.Arn
                Condition: { StringEquals: { "iam:PassedToService": cloudformation.amazonaws.com } }
              - Sid: ArtifactBucket
                Effect: Allow
                Action: [s3:ListBucket, s3:GetBucketLocation]
                Resource: !GetAtt ArtifactBucket.Arn
              - Sid: ThisEnvironmentsArtifacts
                Effect: Allow
                Action: [s3:PutObject, s3:GetObject]
                Resource: !Sub "${ArtifactBucket.Arn}/${AppPrefix}-dev/*"
              - Sid: SiteUpload
                Effect: Allow
                Action: [s3:PutObject, s3:DeleteObject, s3:ListBucket, s3:GetObject]
                Resource:
                  - !Sub "arn:aws:s3:::${AppPrefix}-dev-site-*"
                  - !Sub "arn:aws:s3:::${AppPrefix}-dev-site-*/*"
              - Sid: Invalidate
                Effect: Allow
                Action: [cloudfront:CreateInvalidation, cloudfront:GetInvalidation]
                Resource: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/*"
              - Sid: NotOtherEnvironmentsSite
                Effect: Deny
                Action: "cloudfront:*"
                Resource: "*"
                Condition:
                  "Null": { "aws:ResourceTag/env": "false" }
                  StringNotEquals: { "aws:ResourceTag/env": dev }

  # ================= prod =================

  # Ceiling for every role the prod app stack creates (the Lambda roles): this environment's
  # table and its stream, its own log groups, tracing, and posting to WebSocket connections.
  # Whatever policies a role is given, it can never do more than this.
  ProdBoundary:
    Type: AWS::IAM::ManagedPolicy
    Condition: HasProd
    Properties:
      ManagedPolicyName: !Sub "${AppPrefix}-prod-boundary"
      Description: Permissions boundary for roles created by the prod app stack.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ThisEnvironmentsTable
            Effect: Allow
            Action: "dynamodb:*"
            Resource:
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/TeamHub-prod"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/TeamHub-prod/*"
          - Sid: ListStreams
            Effect: Allow
            Action: dynamodb:ListStreams
            Resource: "*"
          - Sid: OwnLogs
            Effect: Allow
            Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
            Resource:
              - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AppPrefix}-prod-*"
              - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AppPrefix}-prod-*:*"
          - Sid: Tracing
            Effect: Allow
            Action: [xray:PutTraceSegments, xray:PutTelemetryRecords, xray:GetSamplingRules, xray:GetSamplingTargets, xray:GetSamplingStatisticSummaries]
            Resource: "*"
          # The API checks whether someone has two-step sign-in on and resets it for a lost phone.
          # Each role's own policy names its environment's user pool.
          - Sid: TwoStepSignIn
            Effect: Allow
            Action: [cognito-idp:AdminGetUser, cognito-idp:AdminSetUserMFAPreference]
            Resource: !Sub "arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*"
          - Sid: LiveUpdates
            Effect: Allow
            Action: execute-api:ManageConnections
            Resource: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:*/live/POST/@connections/*"

  # The role CloudFormation uses for the prod stack. Resources with predictable names are limited
  # to prod's names. Cognito, API Gateway and CloudFront ids are random, so those rights can't be
  # scoped by name; anything tagged for another environment is refused instead. A separate prod
  # account is what fully isolates them.
  ProdExecRole:
    Type: AWS::IAM::Role
    Condition: HasProd
    Properties:
      RoleName: !Sub "${AppPrefix}-cfn-exec-prod"
      Description: CloudFormation execution role for the prod app stack only.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: cloudformation.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: prod-stack-only
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # With a service role, CloudFormation expands the SAM transform as this role.
              - Sid: SamTransform
                Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource: !Sub "arn:aws:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31"
              - Sid: Table
                Effect: Allow
                Action: "dynamodb:*"
                Resource:
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/TeamHub-prod"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/TeamHub-prod/*"
              - Sid: TableReads
                Effect: Allow
                Action: [dynamodb:ListStreams, dynamodb:DescribeLimits, dynamodb:ListTables]
                Resource: "*"
              - Sid: TableKey
                Effect: Allow
                Action: [kms:DescribeKey, kms:CreateGrant]
                Resource: "*"
                Condition: { StringEquals: { "kms:ViaService": !Sub "dynamodb.${AWS::Region}.amazonaws.com" } }
              - Sid: SiteBucket
                Effect: Allow
                Action: "s3:*"
                Resource:
                  - !Sub "arn:aws:s3:::${AppPrefix}-prod-site-*"
                  - !Sub "arn:aws:s3:::${AppPrefix}-prod-site-*/*"
              - Sid: FunctionCode
                Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion]
                Resource: !Sub "${ArtifactBucket.Arn}/${AppPrefix}-prod/*"
              - Sid: Functions
                Effect: Allow
                Action: "lambda:*"
                Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AppPrefix}-prod-*"
              - Sid: StreamTriggers
                Effect: Allow
                Action: [lambda:CreateEventSourceMapping, lambda:UpdateEventSourceMapping, lambda:DeleteEventSourceMapping]
                Resource: "*"
                Condition: { ArnLike: { "lambda:FunctionArn": !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AppPrefix}-prod-*" } }
              - Sid: StreamTriggerReads
                Effect: Allow
                Action: [lambda:GetEventSourceMapping, lambda:ListEventSourceMappings, lambda:ListTags, lambda:TagResource, lambda:UntagResource]
                Resource: "*"
              - Sid: AppRolesNeedTheBoundary
                Effect: Allow
                Action: [iam:CreateRole, iam:PutRolePermissionsBoundary]
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/${AppPrefix}-prod-*"
                Condition: { StringEquals: { "iam:PermissionsBoundary": !Ref ProdBoundary } }
              # "IfExists" lets the first deploy update roles made before boundaries existed, in
              # whatever order CloudFormation applies the changes. New roles can't skip the boundary
              # (above) and it can't be removed (KeepTheBoundary), so after that deploy every role has it.
              - Sid: AppRolePolicies
                Effect: Allow
                Action: [iam:AttachRolePolicy, iam:DetachRolePolicy, iam:PutRolePolicy, iam:DeleteRolePolicy]
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/${AppPrefix}-prod-*"
                Condition: { StringEqualsIfExists: { "iam:PermissionsBoundary": !Ref ProdBoundary } }
              - Sid: AppRoles
                Effect: Allow
                Action:
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:DeleteRole
                  - iam:UpdateRole
                  - iam:UpdateRoleDescription
                  - iam:UpdateAssumeRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:ListRoleTags
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/${AppPrefix}-prod-*"
              - Sid: PassAppRolesToLambda
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/${AppPrefix}-prod-*"
                Condition: { StringEquals: { "iam:PassedToService": lambda.amazonaws.com } }
              - Sid: ServiceLinkedRoles
                Effect: Allow
                Action: iam:CreateServiceLinkedRole
                Resource: "*"
                Condition: { StringEquals: { "iam:AWSServiceName": [ops.apigateway.amazonaws.com, replication.dynamodb.amazonaws.com] } }
              - Sid: LogGroups
                Effect: Allow
                Action: "logs:*"
                Resource:
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AppPrefix}-prod-*"
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AppPrefix}-prod-*:*"
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/apigateway/${AppPrefix}-prod-*"
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/apigateway/${AppPrefix}-prod-*:*"
              - Sid: ApiAccessLogDelivery
                Effect: Allow
                Action:
                  - logs:DescribeLogGroups
                  - logs:CreateLogDelivery
                  - logs:GetLogDelivery
                  - logs:UpdateLogDelivery
                  - logs:DeleteLogDelivery
                  - logs:ListLogDeliveries
                  - logs:PutResourcePolicy
                  - logs:DescribeResourcePolicies
                Resource: "*"
              - Sid: Alarms
                Effect: Allow
                Action: [cloudwatch:PutMetricAlarm, cloudwatch:DeleteAlarms, cloudwatch:TagResource, cloudwatch:UntagResource, cloudwatch:ListTagsForResource]
                Resource: !Sub "arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${AppPrefix}-prod-*"
              - Sid: AlarmReads
                Effect: Allow
                Action: cloudwatch:DescribeAlarms
                Resource: "*"
              - Sid: Budget
                Effect: Allow
                Action: [budgets:ModifyBudget, budgets:ViewBudget, budgets:ListTagsForResource, budgets:TagResource, budgets:UntagResource]
                Resource: !Sub "arn:aws:budgets::${AWS::AccountId}:budget/${AppPrefix}-prod-*"
              - Sid: SignIn
                Effect: Allow
                Action: "cognito-idp:*"
                Resource: "*"
              - Sid: Apis
                Effect: Allow
                Action: "apigateway:*"
                Resource:
                  - !Sub "arn:aws:apigateway:${AWS::Region}::/apis"
                  - !Sub "arn:aws:apigateway:${AWS::Region}::/apis/*"
                  - !Sub "arn:aws:apigateway:${AWS::Region}::/tags/*"
              - Sid: Cdn
                Effect: Allow
                Action:
                  - cloudfront:CreateDistribution
                  - cloudfront:UpdateDistribution
                  - cloudfront:DeleteDistribution
                  - cloudfront:CreateOriginAccessControl
                  - cloudfront:UpdateOriginAccessControl
                  - cloudfront:DeleteOriginAccessControl
                  - cloudfront:TagResource
                  - cloudfront:UntagResource
                  - "cloudfront:Get*"
                  - "cloudfront:List*"
                Resource: "*"
              # Cognito, API Gateway and CloudFront are allowed by service above. Refuse anything
              # tagged (or being tagged) for a different environment.
              - Sid: NotOtherEnvironments
                Effect: Deny
                Action: ["cognito-idp:*", "apigateway:*", "cloudfront:*", "lambda:*"]
                Resource: "*"
                Condition:
                  "Null": { "aws:ResourceTag/env": "false" }
                  StringNotEquals: { "aws:ResourceTag/env": prod }
              - Sid: NoRetaggingToOtherEnvironments
                Effect: Deny
                Action: ["cognito-idp:*", "apigateway:*", "cloudfront:*", "lambda:*"]
                Resource: "*"
                Condition:
                  "Null": { "aws:RequestTag/env": "false" }
                  StringNotEquals: { "aws:RequestTag/env": prod }
              - Sid: KeepTheBoundary
                Effect: Deny
                Action: [iam:DeleteRolePermissionsBoundary, iam:CreatePolicyVersion, iam:SetDefaultPolicyVersion, iam:DeletePolicy]
                Resource: "*"

  ProdDeployRole:
    Type: AWS::IAM::Role
    Condition: HasProd
    Properties:
      RoleName: !Sub "${AppPrefix}-github-deploy-prod"
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - MakeProvider
                - !Ref GitHubOidcProvider
                - !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                "token.actions.githubusercontent.com:aud": sts.amazonaws.com
                "token.actions.githubusercontent.com:sub":
                  - !Sub "repo:${GitHubOwner}@${GitHubOwnerId}/${GitHubRepo}@${GitHubRepoId}:environment:prod"
                  - !Sub "repo:${GitHubOwner}/${GitHubRepo}:environment:prod"
      Policies:
        - PolicyName: deploy-prod
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Stack
                Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:CreateChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - "cloudformation:Describe*"
                  - "cloudformation:GetTemplate*"
                  - cloudformation:ListStackResources
                Resource: !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AppPrefix}-prod/*"
              - Sid: SamTransform
                Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource: !Sub "arn:aws:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31"
              - Sid: ValidateTemplates
                Effect: Allow
                Action: [cloudformation:ValidateTemplate, cloudformation:ListStacks, cloudformation:GetTemplateSummary]
                Resource: "*"
              - Sid: PassOnlyThisEnvironmentsExecRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !If
                  - KeepShared
                  - [!GetAtt ProdExecRole.Arn, !GetAtt CfnExecutionRole.Arn]
                  - !GetAtt ProdExecRole.Arn
                Condition: { StringEquals: { "iam:PassedToService": cloudformation.amazonaws.com } }
              - Sid: ArtifactBucket
                Effect: Allow
                Action: [s3:ListBucket, s3:GetBucketLocation]
                Resource: !GetAtt ArtifactBucket.Arn
              - Sid: ThisEnvironmentsArtifacts
                Effect: Allow
                Action: [s3:PutObject, s3:GetObject]
                Resource: !Sub "${ArtifactBucket.Arn}/${AppPrefix}-prod/*"
              - Sid: SiteUpload
                Effect: Allow
                Action: [s3:PutObject, s3:DeleteObject, s3:ListBucket, s3:GetObject]
                Resource:
                  - !Sub "arn:aws:s3:::${AppPrefix}-prod-site-*"
                  - !Sub "arn:aws:s3:::${AppPrefix}-prod-site-*/*"
              - Sid: Invalidate
                Effect: Allow
                Action: [cloudfront:CreateInvalidation, cloudfront:GetInvalidation]
                Resource: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/*"
              - Sid: NotOtherEnvironmentsSite
                Effect: Deny
                Action: "cloudfront:*"
                Resource: "*"
                Condition:
                  "Null": { "aws:ResourceTag/env": "false" }
                  StringNotEquals: { "aws:ResourceTag/env": prod }

Outputs:
  ArtifactBucketName:
    Value: !Ref ArtifactBucket
  DevDeployRoleArn:
    Condition: HasDev
    Value: !GetAtt DevDeployRole.Arn
  DevExecRoleArn:
    Condition: HasDev
    Value: !GetAtt DevExecRole.Arn
  DevBoundaryArn:
    Condition: HasDev
    Value: !Ref DevBoundary
  ProdDeployRoleArn:
    Condition: HasProd
    Value: !GetAtt ProdDeployRole.Arn
  ProdExecRoleArn:
    Condition: HasProd
    Value: !GetAtt ProdExecRole.Arn
  ProdBoundaryArn:
    Condition: HasProd
    Value: !Ref ProdBoundary
